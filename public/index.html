async function renderOverview(trigger){
  if(_renderCtrl)_renderCtrl.abort();
  _renderCtrl=new AbortController();
  const {signal}=_renderCtrl;
  const main=document.getElementById('main');
  main.style.opacity='0.5';main.style.pointerEvents='none';
  try{
    const now=new Date(),pad=n=>String(n).padStart(2,'0');
    const nowYM=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
    const ovMesKey=_ovMes||nowYM;
    const isCurrentMonth=ovMesKey===nowYM;
    const mesFrom=`${ovMesKey}-01`;
    const mesTo=`${ovMesKey}-${pad(_mesLastDay(ovMesKey))}`;
    const today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    const spaTo=isCurrentMonth?today:mesTo;

    // 1) Local data first — DB local, resposta rápida
    const localRes=await fetch(`/api/stats-local?mes=${ovMesKey}`,{signal});
    if(localRes.status===401){location.href='/acesso-hub.html';return;}
    const local=await localRes.json();
    if(!local.ok) throw new Error(local.error||'Erro ao carregar estatísticas');

    const totaisMap={};(local.totais||[]).forEach(r=>{totaisMap[r.tipo]=r.total;});
    const mesMap={};(local.mes||[]).forEach(r=>{mesMap[r.tipo]=r.total;});
    const mesSubMap={};(local.mesSub||[]).forEach(r=>{if(r.subtipo)mesSubMap[r.subtipo]=r.total;});
    const totaisSubMap={};(local.totaisSub||[]).forEach(r=>{if(r.subtipo)totaisSubMap[r.subtipo]=r.total;});
    mesMap['eventos-corp']=mesSubMap['eventos-corporativos']||0;
    mesMap['eventos-soc']=(mesSubMap['eventos-cliente']||0)+(mesSubMap['eventos-cerimonialista']||0);
    totaisMap['eventos-corp']=totaisSubMap['eventos-corporativos']||0;
    totaisMap['eventos-soc']=(totaisSubMap['eventos-cliente']||0)+(totaisSubMap['eventos-cerimonialista']||0);
    const localTotal=(totaisMap.geral||0)+(totaisMap.pdvs||0)+(totaisMap.eventos||0);
    const localMes=(mesMap.geral||0)+(mesMap.pdvs||0)+(mesMap.eventos||0);

    function progressCard(key,label,tab,spaMes){
      const mes=key==='spa'?spaMes:(mesMap[key]||0);
      const total=key==='spa'?spaMes:(totaisMap[key]||0);
      const meta=METAS[key]||1;
      const pct=Math.min(100,Math.round(mes/meta*100));
      const cls=pct>=100?'ok':pct>=60?'mid':'low';
      const faltam=Math.max(0,meta-mes);
      const statusLabel=pct>=100?'✓ Meta atingida':`faltam ${faltam}`;
      return `<div class="ov-card ${cls}" data-goto="${tab}">
        <div class="ovx-row-label">${esc(label)}</div>
        <div class="ovx-row-frac"><b>${mes}</b> / ${meta}</div>
        <div class="ovx-row-bar"><i class="${cls}" style="width:${pct}%"></i></div>
        <div class="ovx-row-pct ${cls}">${pct}%</div>
        <div class="ovx-row-status ${cls}">${statusLabel}</div>
      </div>`;
    }

    // 2) Render imediatamente com dados locais; SPA com placeholder
    const _tipoData=[
      {key:'geral',label:'Geral',val:mesMap.geral||0},
      {key:'pdvs',label:'PDVs',val:mesMap.pdvs||0},
      {key:'eventos-corp',label:'Corp.',val:mesMap['eventos-corp']||0},
      {key:'eventos-soc',label:'Sociais',val:mesMap['eventos-soc']||0},
    ];
    const _tipoMax=Math.max(localMes,1);
    const tipoRowsHtml=[..._tipoData,{key:'spa',label:'Gran SPA',val:0}].map(t=>`<div class="ov-tipo-row" id="ov-tipo-${t.key}"><div class="ov-tipo-name">${t.label}</div><div class="ov-tipo-bar"><div class="ov-tipo-bar-fill" id="ov-bar-${t.key}" style="width:${t.key==='spa'?0:Math.round(t.val/_tipoMax*100)}%"></div></div><div class="ov-tipo-count" id="ov-cnt-${t.key}">${t.key==='spa'?'<span style="opacity:.3">—</span>':t.val}</div></div>`).join('');
    main.innerHTML=`
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px">
        <button class="btn-icon" id="ovPrevMes" title="Mês anterior" style="flex:none;font-size:.9rem">←</button>
        <span style="font-family:'JetBrains Mono',monospace;font-size:.76rem;letter-spacing:.16em;color:var(--text);min-width:138px;text-align:center">${_fmtMes(ovMesKey)}</span>
        <button class="btn-icon" id="ovNextMes" title="Próximo mês" ${isCurrentMonth?'disabled style="opacity:.4;cursor:default;flex:none;font-size:.9rem"':'style="flex:none;font-size:.9rem"'}>→</button>
        ${!isCurrentMonth?`<span style="font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:2px 9px;border:1px solid var(--gold-dim);border-radius:20px;flex:none">histórico</span>`:''}
      </div>
      <div class="ovx-hero">
        <div>
          <div class="eyebrow" style="margin-bottom:14px">${isCurrentMonth?'Bom dia · Visão geral':_fmtMes(ovMesKey)}</div>
          <div class="ovx-hero-num" id="ov-total-val">${localMes}<em>mês</em></div>
          <div class="ovx-hero-sub" id="ov-acumulado-sub">${isCurrentMonth?`avaliações em todos os setores · acumulado: ${localTotal}`:`avaliações em todos os setores no período`}</div>
        </div>
        <div class="ovx-hero-div"></div>
        <div>${tipoRowsHtml}</div>
      </div>
      <section class="ovx-band">
        <div class="ovx-band-hd"><span class="eyebrow">Metas do mês</span><span class="ovx-band-rule"></span></div>
        <div class="ovx-ledger">
          <div id="ov-card-spa" class="ov-card" style="opacity:.4" data-goto="spa"><div class="ovx-row-label">Gran SPA</div><div class="ovx-row-frac">—</div><div class="ovx-row-bar"><i style="width:0%"></i></div><div class="ovx-row-pct">—</div><div class="ovx-row-status">carregando…</div></div>
          ${progressCard('geral','Geral da Qualidade','geral',0)}
          ${progressCard('pdvs','PDVs','pdvs',0)}
          ${progressCard('eventos-corp','Corporativos','eventos-corp',0)}
          ${progressCard('eventos-soc','Sociais','eventos-soc',0)}
        </div>
      </section>
      <section class="ovx-band">
        <div class="ovx-band-hd"><span class="eyebrow">Pesquisas por urna</span><span class="ovx-band-rule"></span><span class="ovx-band-kpi" id="ov-urna-total">—<small>vinculadas este mês</small></span></div>
        <div id="ov-urna-list"><div style="opacity:.35;font-size:.74rem;color:var(--muted);padding:14px 10px">carregando urnas…</div></div>
      </section>
      <div class="eyebrow" style="margin-bottom:14px">Todas as avaliações</div>
      <div class="filter-shell" style="margin-bottom:24px">
        <div class="filter-head">
          <span class="filter-num">◆</span>
          <span class="filter-label">Filtros</span>
          <span class="filter-rule"></span>
        </div>
        <div class="filter-box">
          <div class="filter-group">
            <span class="fl">Tipo</span>
            <div class="fi"><select id="ovTipo">
              <option value="">Todos</option>
              <option value="spa" ${ovState.tipo==='spa'?'selected':''}>Gran SPA</option>
              <option value="geral" ${ovState.tipo==='geral'?'selected':''}>Geral</option>
              <option value="pdvs" ${ovState.tipo==='pdvs'?'selected':''}>PDVs</option>
              <option value="eventos-corp" ${ovState.tipo==='eventos-corp'?'selected':''}>Corporativos</option>
              <option value="eventos-soc" ${ovState.tipo==='eventos-soc'?'selected':''}>Sociais</option>
            </select><svg class="fi-chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
          </div>
          <div class="filter-group">
            <span class="fl">Período</span>
            <div class="fi-range">
              <input type="date" id="ovFrom" value="${ovState.from}" max="${today}">
              <span class="fi-arrow">→</span>
              <input type="date" id="ovTo" value="${ovState.to}" max="${today}">
            </div>
          </div>
          <div class="filter-group filter-flex">
            <span class="fl">Busca</span>
            <div class="fi">
              <svg class="fi-lupa" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
              <input type="text" id="ovQ" placeholder="Nome, empresa…" value="${esc(ovState.q)}">
            </div>
          </div>
          <button class="btn-gold btn-filtrar" id="btnOvF">Filtrar</button>
        </div>
      </div>
      <div id="ovTable"></div>
    `;
    main.style.opacity='';main.style.pointerEvents='';
    main.querySelectorAll('.ov-card[data-goto]').forEach(card=>{
      card.addEventListener('click',()=>{
        const el=document.querySelector(`.tab[data-tab="${card.dataset.goto}"]`);
        if(el)el.click();
      });
    });
    const tableEl=main.querySelector('#ovTable');
    renderOverviewTable(tableEl);
    document.getElementById('ovPrevMes')?.addEventListener('click',()=>{_ovMes=_addMonths(ovMesKey,-1);renderOverview('month');});
    document.getElementById('ovNextMes')?.addEventListener('click',()=>{if(!isCurrentMonth){_ovMes=_addMonths(ovMesKey,1);if(_ovMes===nowYM)_ovMes='';renderOverview('month');}});
    const applyOvFilter=()=>{
      ovState.tipo=document.getElementById('ovTipo')?.value||'';
      ovState.from=document.getElementById('ovFrom')?.value||'';
      ovState.to=document.getElementById('ovTo')?.value||'';
      ovState.q=document.getElementById('ovQ')?.value||'';
      ovState.page=1;
      renderOverviewTable(tableEl);
    };
    document.getElementById('btnOvF')?.addEventListener('click',applyOvFilter);
    document.getElementById('ovQ')?.addEventListener('keydown',e=>{if(e.key==='Enter')applyOvFilter();});

    // 3) SPA data — background; atualiza DOM quando chegar
    Promise.all([
      fetch(`/api/stats?slug=spa-locc-v1&from=${mesFrom}&to=${spaTo}`,{signal}).then(r=>r.ok?r.json():null),
      fetch(`/api/stats?slug=spa-locc-v1`,{signal}).then(r=>r.ok?r.json():null),
    ]).then(([spa,spaAll])=>{
        if(!spa||signal.aborted)return;
        const spaMes=spa.total||0;
        const spaTotal=spaAll?.total||0;
        const heroVal=main.querySelector('#ov-total-val');
        if(heroVal)heroVal.innerHTML=`${localMes+spaMes}<em>mês</em>`;
        const subEl=main.querySelector('#ov-acumulado-sub');
        if(subEl)subEl.textContent=isCurrentMonth?`avaliações em todos os setores · acumulado: ${localTotal+spaTotal}`:`avaliações em todos os setores no período`;
        const cntSpa=main.querySelector('#ov-cnt-spa');
        if(cntSpa)cntSpa.textContent=spaMes;
        const barSpa=main.querySelector('#ov-bar-spa');
        if(barSpa){
          const newMax=Math.max(localMes+spaMes,1);
          barSpa.style.width=Math.round(spaMes/newMax*100)+'%';
          _tipoData.forEach(t=>{const b=main.querySelector(`#ov-bar-${t.key}`);if(b)b.style.width=Math.round(t.val/newMax*100)+'%';});
        }
        const spaCardEl=main.querySelector('#ov-card-spa');
        if(spaCardEl){
          spaCardEl.outerHTML=progressCard('spa','Gran SPA','spa',spaMes);
          main.querySelector('.ov-card[data-goto="spa"]')?.addEventListener('click',()=>{
            document.querySelector('.tab[data-tab="spa"]')?.click();
          });
        }
      })
      .catch(()=>{});
    // Urnas stats — cruza GQ local com nomes do Hub
    Promise.all([
      fetch(`/api/urnas-stats?mes=${ovMesKey}`,{signal}).then(r=>r.ok?r.json():null).catch(()=>null),
      _loadUrnas(),
      fetch(`/api/stats?slug=spa-locc-v1&from=${mesFrom}&to=${spaTo}`,{signal}).then(r=>r.ok?r.json():null).catch(()=>null)
    ]).then(([stats,hubUrnas,spaStats])=>{
      if(!stats||signal.aborted)return;
      const allUrnas=hubUrnas||[];
      const nameMap={};allUrnas.forEach(u=>{nameMap[String(u.id)]=u.nome;});
      const rows=stats.mes||[];
      // A urna Gran SPA só recebe pesquisas do site — espelha o total do SPA no mês
      const spaSiteCount=Math.max(spaStats?.total||0,stats.spa_site||0);
      const comUrna=rows.filter(r=>r.urna_id!=null);
      const urnaCountMap={};comUrna.forEach(r=>{if(r.urna_id!=null)urnaCountMap[String(r.urna_id)]=r.total;});
      const urnaList=main.querySelector('#ov-urna-list');
      if(urnaList){
        // Painel herói: mostra todas as urnas do Hub (mesmo com 0 avaliações)
        const allForPanel=allUrnas.length
          ?allUrnas.map(u=>({urna_id:String(u.id),total:urnaCountMap[String(u.id)]||0,nome:u.nome}))
          :comUrna.map(r=>({urna_id:String(r.urna_id),total:r.total,nome:nameMap[String(r.urna_id)]||`Urna ${String(r.urna_id).slice(0,8)}`}));
        if(!allForPanel.length&&!spaSiteCount){
          urnaList.innerHTML='<div style="opacity:.35;font-size:.74rem;color:var(--muted);padding:14px 10px">Nenhuma urna cadastrada no Hub.</div>';
          const ut0=main.querySelector('#ov-urna-total');
          if(ut0)ut0.innerHTML='0<small>vinculadas este mês</small>';
        }else{
          const mkRow=(nome,total,meta)=>{
            const hasMeta=meta>0;
            const pct=hasMeta?Math.min(100,Math.round(total/meta*100)):0;
            const cls=hasMeta?(pct>=100?'ok':pct>=60?'mid':'low'):'';
            const status=hasMeta?(pct>=100?'✓ Meta atingida':`faltam ${Math.max(0,meta-total)}`):'sem meta';
            return `<div class="ov-card ${cls}" style="cursor:default"><div class="ovx-row-label">${esc(nome)}</div><div class="ovx-row-frac"><b>${total}</b>${hasMeta?` / ${meta}`:''}</div><div class="ovx-row-bar"><i class="${cls}" style="width:${pct}%"></i></div><div class="ovx-row-pct ${cls}">${hasMeta?pct+'%':'—'}</div><div class="ovx-row-status ${cls}">${status}</div></div>`;
          };
          const cells=[];
          allForPanel.forEach(r=>cells.push({nome:r.nome||'',total:r.total,meta:METAS['urna:'+r.urna_id]||0}));
          // A urna Gran SPA espelha o total de pesquisas do site (única fonte dela)
          const spaCell=cells.find(c=>/gran\s*spa/i.test(c.nome));
          if(spaCell){spaCell.total=spaSiteCount;if(!(spaCell.meta>0))spaCell.meta=METAS['spa']||0;}
          else if(spaSiteCount>0)cells.push({nome:'Gran SPA',total:spaSiteCount,meta:METAS['spa']||0});
          const vinculado=cells.reduce((s,c)=>s+c.total,0);
          const urnaTotal=main.querySelector('#ov-urna-total');
          if(urnaTotal)urnaTotal.innerHTML=`${vinculado}<small>vinculadas este mês</small>`;
          cells.sort((a,b)=>(b.total-a.total)||((b.meta>0)-(a.meta>0))||a.nome.localeCompare(b.nome));
          const ativos=cells.filter(c=>c.total>0||c.meta>0);
          const zerados=cells.filter(c=>!(c.total>0||c.meta>0));
          const rowsHtml=ativos.length?`<div class="ovx-ledger">${ativos.map(c=>mkRow(c.nome,c.total,c.meta)).join('')}</div>`:'';

      state.q=document.getElementById('fQ')?.value||'';
      state.page=1;render('filter');

    document.getElementById('fQ')?.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      state.from=document.getElementById('fFrom')?.value||'';
      state.to=document.getElementById('fTo')?.value||'';
      state.periodCustom=!!(state.from||state.to);
      state.q=document.getElementById('fQ').value||'';
      state.page=1;render('filter');
    });
    document.querySelectorAll('.chip-x').forEach(x=>x.addEventListener('click',()=>{
      const k=x.dataset.key;
      if(k==='from'){state.from='';state.periodCustom=!!(state.to);}
      else if(k==='to'){state.to='';state.periodCustom=!!(state.from);}
      else if(k in state)state[k]='';
      state.page=1;render('chip');
    }));
    document.getElementById('pgPrev')?.addEventListener('click',()=>{if(state.page>1){state.page--;render('page');}});
    document.getElementById('pgNext')?.addEventListener('click',()=>{if(state.page<state.totalPages){state.page++;render('page');}});
    document.querySelectorAll('.ev-soc-pill').forEach(btn=>{

      row.addEventListener('click',()=>{const id=parseInt(row.dataset.id);if(id)openLocalDetail(id);});

async function renderOverviewTable(containerEl){
  containerEl.innerHTML='<div class="empty" style="padding:32px 0">Carregando...</div>';
  const _ovAbort=new AbortController();const signal=_ovAbort.signal;
  try{
    const {tipo,from,to,q,page}=ovState;
    const OV_LIMIT=20;
    let items=[],total=0,totalPages=1;
    const isLocal=!tipo||tipo==='geral'||tipo==='pdvs'||tipo==='eventos'||tipo==='eventos-corp'||tipo==='eventos-soc';
    const isSpa=!tipo||tipo==='spa';

    if(isLocal&&tipo!=='spa'){
      const qs=new URLSearchParams({from:from||'',to:to||'',q:q||'',page:tipo?page:1,limit:tipo?OV_LIMIT:15});
      if(tipo)qs.set('tipo',tipo);
      const r=await fetch('/api/respostas-local?'+qs,{signal});
      if(r.status===401){location.href='/acesso-hub.html';return;}
      const d=await r.json();
      if(!d.ok)throw new Error(d.error);
      items=(d.items||[]).map(i=>({...i,_src:'local'}));
      total=d.total||0;
      totalPages=Math.ceil(total/OV_LIMIT)||1;
    }

    if(isSpa){
      const qs2=new URLSearchParams({slug:'spa-locc-v1',from:from||'',to:to||'',q:q||'',page:tipo==='spa'?page:1,limit:tipo==='spa'?OV_LIMIT:15});
      const r2=await fetch('/api/respostas?'+qs2,{signal});
      if(r2.status===401){location.href='/acesso-hub.html';return;}
      const d2=await r2.json();
      const spaItems=(d2.items||[]).map(i=>({id:i.id,date:i.date,nome:i.nome,email:i.email,tipo_pesquisa:'spa',inserido_por:i.origem==='colaborador'?'Colaborador':'Hóspede',_src:'spa',media:i.media}));
      if(tipo==='spa'){
        items=spaItems;total=d2.total||0;totalPages=Math.ceil(total/OV_LIMIT)||1;
      } else {
        items=[...items,...spaItems].sort((a,b)=>{
          const da=a.date.split('/').reverse().join(''),db=b.date.split('/').reverse().join('');
          return da<db?1:da>db?-1:0;
        }).slice(0,OV_LIMIT);
        total=total+(d2.total||0);
        totalPages=1;
      }
    }
    ovState.totalPages=totalPages;

    const badge=r=>{
      if(r._src==='spa')return'Gran SPA';
      const t=r.tipo_pesquisa;
      if(t==='geral-granclass')return'★ Gran Class';
      if(t==='pdvs-granclass')return'★ PDV GC';
      if(t==='geral')return'Geral';
      if(t==='pdvs')return'PDV';
      if(t==='eventos')return'Evento';
      if(t==='eventos-cliente')return'Social · Cliente';
      if(t==='eventos-cerimonialista')return'Social · Parceiros';
      if(t==='eventos-corporativos')return'Corporativo';
      return t||'—';
    };
    const rows=items.map(r=>`<div class="tbl-row" data-id="${r.id}" data-src="${r._src}" style="cursor:pointer">
      <div class="tbl-date">${esc(r.date)}</div>
      <div class="tbl-nome">${esc(r.nome)}</div>
      <div class="tbl-email">${esc(r.email||'—')}</div>
      <div class="tbl-tipo"><span>${esc(badge(r))}</span></div>
      <div class="tbl-orig" style="font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r._src==='spa'?esc(r.inserido_por||'—'):(r.app_origem==='gestao-qualidade'?esc(r.inserido_por||'—'):_extOrigem(r.app_origem))}</div>
      <div>${r.media?`<span class="score ${scoreClass(r.media)}">${esc(r.media)}</span>`:''}</div>
      <div style="display:flex;align-items:center;justify-content:center">${r._src!=='spa'&&r.app_origem==='gestao-qualidade'?`<button class="btn-edit-local" title="Editar" onclick="event.stopPropagation();openLocalEdit(${r.id})">✎</button>`:''}</div>
    </div>`).join('');
    const pgHtml=totalPages>1?`<div class="pgn">
      <button class="pgn-btn" id="ovPgPrev" ${page<=1?'disabled':''}>← Anterior</button>
      <span class="pgn-info">Página ${page} de ${totalPages}</span>
      <button class="pgn-btn" id="ovPgNext" ${page>=totalPages?'disabled':''}>Próxima →</button>
    </div>`:'';
    containerEl.innerHTML=`<div class="tbl-hdr"><div><div class="eyebrow">Registro</div><div class="tbl-title">Avaliações</div></div><div class="tbl-count">${total} resultado${total!==1?'s':''}</div></div>
    <div class="tbl-wrap">
      <div class="tbl-head"><div>Data</div><div>Nome</div><div>E-mail / Empresa</div><div>Tipo</div><div>Inserido por</div><div>Média</div><div></div></div>
      ${rows||'<div class="empty">Nenhuma avaliação encontrada</div>'}
    </div>${pgHtml}`;
    containerEl.querySelector('#ovPgPrev')?.addEventListener('click',()=>{if(ovState.page>1){ovState.page--;renderOverviewTable(containerEl);}});
    containerEl.querySelector('#ovPgNext')?.addEventListener('click',()=>{if(ovState.page<ovState.totalPages){ovState.page++;renderOverviewTable(containerEl);}});
    containerEl.querySelectorAll('.tbl-row[data-id]').forEach(row=>{
      row.addEventListener('click',()=>{
        const id=parseInt(row.dataset.id);
        if(!id)return;
        if(row.dataset.src==='spa')openDetail(id);
        else openLocalDetail(id);
      });
    });
  }catch(e){
    containerEl.innerHTML=`<div class="empty">Erro: ${esc(e.message)}</div>`;
  }
}

async function _addAdmin(){
  const email=(document.getElementById('adminEmailIn')?.value||'').trim();
  const nivel=document.getElementById('adminNivelSel')?.value||'operador';
  const msg=document.getElementById('adminMsg');
  if(!email){if(msg){msg.textContent='Informe o e-mail.';msg.style.color='var(--danger)';msg.style.display='block';}return;}
  if(msg)msg.style.display='none';
  const btn=document.getElementById('btnAddAdmin');
  if(btn)btn.disabled=true;
  try{
    const r=await fetch('/api/admins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,nivel})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Erro');
    renderAdmin();
  }catch(e){
    if(msg){msg.textContent=e.message;msg.style.color='var(--danger)';msg.style.display='block';}
    if(btn)btn.disabled=false;
  }
}
async function _removeAdmin(email){
  try{
    const r=await fetch(`/api/admins/${encodeURIComponent(email)}`,{method:'DELETE'});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Erro');
    renderAdmin();
  }catch(e){alert('Erro ao remover: '+e.message);}
}

  function psUpdateProgress(){
    const idOk=(document.getElementById('psNome')?.value||'').trim()&&(document.getElementById('psEmail')?.value||'').trim();
    const s1Ok=SEC1_QS.every(q=>psRatings[q.key]);
    const s2Ok=SEC2_QS.every(q=>psRatings[q.key]);
    const s34Ok=psRecomenda&&psTipo;
    [idOk,s1Ok,s2Ok,s34Ok].forEach((done,i)=>{const tf=document.getElementById(`psTf${i+1}`);if(tf)tf.style.width=done?'100%':'0';});
  }

  function psMarkAll(nota){
    [...SEC1_QS,...SEC2_QS].forEach(q=>{
      psRatings[q.key]=nota;
      psOverlay.querySelectorAll(`.smiley-btn[data-qkey="${q.key}"]`).forEach(b=>{
        const sel=b.dataset.val===nota;
        b.classList.toggle('selected',sel);
        b.innerHTML=psSmiley(b.dataset.type,sel,30);
      });
    });
    psUpdateProgress();
  }

  function psBindCombo(inputId,listId,items,startOnly){
    const inp=document.getElementById(inputId);
    const lst=document.getElementById(listId);
    if(!inp||!lst||!items.length)return;
    function showList(filter){
      const q=(filter||'').toLowerCase().trim();
      const matches=q?items.filter(n=>startOnly?n.toLowerCase().startsWith(q):n.toLowerCase().includes(q)):items;
      if(!matches.length){lst.innerHTML=`<div class="ps-dropdown-empty">Nenhum resultado</div>`;lst.style.display='block';return;}
      lst.innerHTML=matches.map(n=>`<div class="ps-dropdown-item">${esc(n)}</div>`).join('');
      lst.style.display='block';
      lst.querySelectorAll('.ps-dropdown-item').forEach(el=>el.addEventListener('mousedown',e=>{
        e.preventDefault();
        inp.value=el.textContent;
        lst.style.display='none';
        const errEl=document.getElementById(inputId+'Err');
        if(errEl)errEl.style.display='none';
      }));
    }
    inp.addEventListener('focus',()=>{ if(!startOnly||inp.value.trim())showList(inp.value); });
    inp.addEventListener('input',()=>showList(inp.value));
    inp.addEventListener('blur',()=>setTimeout(()=>{lst.style.display='none';},150));
  }

  async function psLoadLists(){
    try {
      if(!psMassos.length){
        const r=await fetch('/api/massagistas');
        const d=await r.json();
        psMassos=(d.items||[])
          .filter(m=>m.funcao&&m.funcao.toLowerCase().includes('massot'))
          .map(m=>m.nome).filter(Boolean);
      }
    } catch(e){console.warn('[GQ] massagistas:',e);}
    try {
      if(!psTratamentos.length){
        const r=await fetch('/api/tratamentos');
        const d=await r.json();
        psTratamentos=(d.items||[]).map(t=>t.nome).filter(Boolean);
      }
    } catch(e){console.warn('[GQ] tratamentos:',e);}
    try {
      if(!psAptos.length){
        const r=await fetch('/api/quartos');
        const d=await r.json();
        psAptos=(d.items||[]).map(q=>q.numero).filter(Boolean);
      }
    } catch(e){console.warn('[GQ] quartos:',e);}
  }

  const _EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function psValidateTel(){
    const val=(document.getElementById('psTel')?.value||'').trim();
    const errEl=document.getElementById('psTelErr');
    if(!val){ if(errEl)errEl.style.display='none'; return true; }
    let ok;
    if(val.startsWith('+')){
      const d=val.slice(1).replace(/\D/g,'');
      ok=d.length>=8&&d.length<=15;
    } else {
      const d=val.replace(/\D/g,'');
      ok=d.length===10||d.length===11;
    }
    if(errEl)errEl.style.display=ok?'none':'block';
    return ok;
  }
  function psValidateEmail(){
    const val=(document.getElementById('psEmail')?.value||'').trim();
    const errEl=document.getElementById('psEmailErr');
    if(!val){ if(errEl)errEl.style.display='none'; return true; }
    const ok=_EMAIL_RE.test(val);
    if(errEl)errEl.style.display=ok?'none':'block';
    return ok;
  }

  function psNormApto(v){ return v.replace(/\D/g,'').padStart(4,'0'); }

  function psValidateApto(){
    const val=(document.getElementById('psApto')?.value||'').trim();
    const errEl=document.getElementById('psAptoErr');
    if(!val){ if(errEl)errEl.style.display='none'; return true; }
    if(!psAptos.length){ if(errEl)errEl.style.display='none'; return true; }
    const norm=psNormApto(val);
    const ok=psAptos.includes(norm);
    if(errEl)errEl.style.display=ok?'none':'block';
    return ok;
  }

  function psOpen(){
    psRatings={}; psRecomenda=null; psTipo=null;
    psOverlay.innerHTML=psBuildModal();
    _loadUrnas().then(()=>_fillUrna(document.getElementById('psUrna'),['spa']));
    psOverlay.scrollTop=0;
    psOverlay.style.display='block';
    document.body.style.overflow='hidden';
    document.getElementById('psClose')?.addEventListener('click',psClose);
    psOverlay.querySelectorAll('.smiley-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const qkey=btn.dataset.qkey, val=btn.dataset.val;
        if(psRatings[qkey]===val){
          delete psRatings[qkey];
          psOverlay.querySelectorAll(`.smiley-btn[data-qkey="${qkey}"]`).forEach(b=>{
            b.classList.remove('selected');
            b.innerHTML=psSmiley(b.dataset.type,false,30);
          });
        } else {
          psRatings[qkey]=val;
          psOverlay.querySelectorAll(`.smiley-btn[data-qkey="${qkey}"]`).forEach(b=>{
            const sel=b.dataset.val===val;
            b.classList.toggle('selected',sel);
            b.innerHTML=psSmiley(b.dataset.type,sel,30);
          });
        }
        psUpdateProgress();
      });
    });
    ['psNome','psEmail'].forEach(id=>document.getElementById(id)?.addEventListener('input',psUpdateProgress));
    document.getElementById('psApto')?.addEventListener('input',e=>{ e.target.value=e.target.value.replace(/\D/g,''); psUpdateProgress(); });
    document.getElementById('psApto')?.addEventListener('blur',()=>setTimeout(()=>psValidateApto(),200));
    document.getElementById('psControleInterno')?.addEventListener('input',e=>{ e.target.value=e.target.value.replace(/\D/g,''); });
    document.getElementById('psTel')?.addEventListener('input',e=>{ e.target.value=e.target.value.replace(/[^\d+\s()\-]/g,''); psValidateTel(); });
    document.getElementById('psEmail')?.addEventListener('input',()=>{ psValidateEmail(); psUpdateProgress(); });
    document.getElementById('psRadioSim')?.addEventListener('click',()=>{
      psRecomenda='sim';
      document.getElementById('psDotSim')?.classList.add('on');
      document.getElementById('psDotNao')?.classList.remove('on');
      const rS=document.getElementById('psRevSim'),rN=document.getElementById('psRevNao');
      if(rS)rS.style.display='block'; if(rN)rN.style.display='none';
      psUpdateProgress();
    });
    document.getElementById('psRadioNao')?.addEventListener('click',()=>{
      psRecomenda='nao';
      document.getElementById('psDotNao')?.classList.add('on');
      document.getElementById('psDotSim')?.classList.remove('on');
      const rS=document.getElementById('psRevSim'),rN=document.getElementById('psRevNao');
      if(rS)rS.style.display='none'; if(rN)rN.style.display='block';
      psUpdateProgress();
    });
    psOverlay.querySelectorAll('[data-tipo]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        psTipo=btn.dataset.tipo;
        psOverlay.querySelectorAll('[data-tipo]').forEach(b=>{
          const dot=b.querySelector('.radio-dot');
          if(dot)dot.classList.toggle('on',b.dataset.tipo===psTipo);
        });
        psUpdateProgress();
      });
    });
document.getElementById('psSubmitBtn')?.addEventListener('click',psSubmit);
    psOverlay.querySelectorAll('.ps-mark-all').forEach(btn=>btn.addEventListener('click',()=>psMarkAll(btn.dataset.nota)));
    psLoadLists().then(()=>{
      if(!document.getElementById('psMasso'))return;
      psBindCombo('psMasso','psMassoList',psMassos);
      psBindCombo('psTratamento','psTratamentoList',psTratamentos);
      psBindCombo('psApto','psAptoList',psAptos.map(String),true);
    });
  }

  function psClose(){psOverlay.style.display='none';document.body.style.overflow='';}

  async function psSubmit(){
    const btn=document.getElementById('psSubmitBtn'),msgEl=document.getElementById('psMsg');
    const nome=(document.getElementById('psNome')?.value||'').trim();
    const email=(document.getElementById('psEmail')?.value||'').trim();
    if(!psValidateEmail()){msgEl.textContent='E-mail inválido.';msgEl.style.display='block';return;}
    if(!psValidateTel()){msgEl.textContent='Telefone inválido. Ex: 85 99999-9999';msgEl.style.display='block';return;}
    if(!psValidateApto()){msgEl.textContent='Corrija o Nº do Apto antes de enviar.';msgEl.style.display='block';return;}
    const _dataTrat=(document.getElementById('psData')?.value||'').trim();
    if(_dataTrat&&_dataTrat>psToday()){msgEl.textContent='A data do tratamento não pode ser futura.';msgEl.style.display='block';return;}
    if(!(document.getElementById('psUrna')?.value||'')){msgEl.textContent='Selecione a urna.';msgEl.style.display='block';return;}
    if(!(document.getElementById('psControleInterno')?.value||'').trim()){msgEl.textContent='Informe o Nº do questionário.';msgEl.style.display='block';return;}
    btn.disabled=true; msgEl.style.display='none';
    try {
      const payload={
        nome,email,
        apto:(document.getElementById('psApto')?.value||'').trim()||null,
        controle_interno:(document.getElementById('psControleInterno')?.value||'').trim()||null,
        urna_id:(document.getElementById('psUrna')?.value||'')||null,
        telefone:(document.getElementById('psTel')?.value||'').trim()||null,
        data_tratamento:(document.getElementById('psData')?.value||'').trim()||null,
        tratamento_realizado:(document.getElementById('psTratamento')?.value||'').trim()||null,
        nome_massoterapeuta:(document.getElementById('psMasso')?.value||'').trim()||null,
        ...psRatings,
        servicos_comentario:(document.getElementById('psComSec1')?.value||'').trim()||null,
        instalacoes_comentario:(document.getElementById('psComSec2')?.value||'').trim()||null,
        recomenda:psRecomenda||null,
        recomenda_qual:psRecomenda==='sim'?(document.getElementById('psRecomendaQual')?.value||'').trim()||null:null,
        recomenda_porque:psRecomenda==='nao'?(document.getElementById('psRecomendaPorque')?.value||'').trim()||null:null,
        tipo_cliente:psTipo||'lazer',
        origem:'colaborador',
        pesquisa_slug:'spa-locc-v1',
        app_origem:'gestao-qualidade',
      };
      const r=await fetch('/api/nova-resposta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(r.status===401){location.href='/acesso-hub.html';return;}
      const data=await r.json();
      if(!data.ok) throw new Error(data.error||'Erro ao enviar');
      if(data._editMode){msgEl.style.color='var(--success)';msgEl.textContent='Pesquisa editada com sucesso ✓';msgEl.style.display='block';setTimeout(()=>psClose(),1500);return;}
      msgEl.textContent='Pesquisa enviada com sucesso! ✓';
      msgEl.style.color='var(--success)';
      msgEl.style.display='block';
      setTimeout(()=>{render();psOpen();},1800);
    } catch(e){
      msgEl.textContent=`Erro: ${e.message}`;
      msgEl.style.color='var(--danger)';
      msgEl.style.display='block';
      btn.disabled=false;
    }
  }

  // Picker de pesquisa
  const PESQUISAS = [
    { label: 'Pesquisa geral da qualidade', active: true, action: 'geral' },
    { label: 'Pesquisa PDVs', active: true, action: 'pdvs' },
    { label: 'Pesquisa Gran SPA', active: true, action: 'spa' },
    { label: 'Pesquisa de Eventos Corporativos', active: true, action: 'eventos-corporativos', section: 'Eventos Corporativos' },
    { label: 'Pesquisa de Eventos Sociais — Cliente', active: true, action: 'eventos-cliente', section: 'Eventos Sociais' },
    { label: 'Pesquisa de Eventos Sociais — Parceiros', active: true, action: 'eventos-cerimonialista' },
  ];
  function buildPickerItems(){
    let html='', lastSection=null;
    PESQUISAS.forEach((p,i)=>{
      if(p.section&&p.section!==lastSection){
        html+=`<div style="font-size:.6rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:10px 4px 4px;opacity:.8">${p.section}</div>`;
        lastSection=p.section;
      }
      const indent=lastSection?'padding-left:10px;':'';
      html+=`<button class="picker-item${p.active?'':' picker-soon'}" data-idx="${i}" style="${indent}">
        <span>${p.label}</span>
        ${p.active?'<span class="picker-arrow">→</span>':'<span class="picker-badge">Em breve</span>'}
      </button>`;
    });
    return html;
  }
  const pickerOverlay = document.createElement('div');
  pickerOverlay.id = 'pickerOverlay';
  pickerOverlay.innerHTML = `<div id="pickerModal">
    <button class="picker-close" id="pickerClose">✕</button>
    <div class="picker-title">Selecionar pesquisa</div>
    <div class="picker-list">${buildPickerItems()}</div>
  </div>`;
  document.body.appendChild(pickerOverlay);
  function pickerOpen(){ pickerOverlay.classList.add('open'); }
  function pickerClose(){ pickerOverlay.classList.remove('open'); }
  document.getElementById('pickerClose').addEventListener('click', pickerClose);
  pickerOverlay.querySelectorAll('.picker-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx = parseInt(btn.dataset.idx);
      const p = PESQUISAS[idx];
      if(!p.active) return;
      pickerClose();
      if(p.action==='spa') psOpen();
      else if(window._openers?.[p.action]) window._openers[p.action]();
    });
  });
  document.getElementById('btnNovaPesquisa')?.addEventListener('click', pickerOpen);
  window._openers=window._openers||{};
  window._openers['spa']=psOpen;
}

{

      ['Hotel · Geral', u => (u.pesquisas||[]).some(t => t.startsWith('geral'))],
      ['Restaurantes & Bares', u => (u.pesquisas||[]).some(t => t.startsWith('pdvs'))],
      ['Eventos', u => (u.pesquisas||[]).some(t => t.startsWith('eventos'))],
      ['Gran SPA', u => (u.pesquisas||[]).includes('spa')],
    ];
    const usadas = new Set();
    const row = u => `
      <div class="cfg-row">
        <div class="cfg-row-label">${esc(u.nome||String(u.id))}</div>
        <div class="cfg-input-wrap">
          <input class="cfg-input" type="number" min="0" step="1" id="cfgU_${esc(String(u.id))}" value="${METAS['urna:'+u.id]||0}" inputmode="numeric">
          <div class="cfg-input-unit">/ mês</div>
        </div>
      </div>`;
    let html = '';
    for (const [titulo, pred] of grupos) {
      const doGrupo = urnas.filter(u => !usadas.has(u.id) && pred(u));
      if (!doGrupo.length) continue;
      doGrupo.forEach(u => usadas.add(u.id));
      html += `<div class="cfg-group-cap">${titulo}</div>` + doGrupo.map(row).join('');
    }
    const resto = urnas.filter(u => !usadas.has(u.id));
    if (resto.length) html += `<div class="cfg-group-cap">Outras</div>` + resto.map(row).join('');
    return html;
  }

  function cfgOpen() {
    const cfgOv = _cfgEl('cfgOverlay');
    const cfgBod = _cfgEl('cfgBody');
    if (!cfgOv || !cfgBod) return;
    cfgOv.classList.add('cfg-open');
    cfgOv.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    const cfgMsg = _cfgEl('cfgMsg');
    if (cfgMsg) cfgMsg.style.display = 'none';

    const pesquisasRows = CFG_PESQUISAS.map(p => `
      <div class="cfg-row">
        <div class="cfg-row-label">
          ${esc(p.label)}
          ${p.sub ? `<div class="cfg-row-sub">${esc(p.sub)}</div>` : ''}
        </div>
        <div class="cfg-input-wrap">
          <input class="cfg-input" type="number" min="0" step="1" id="cfgP_${p.key}" value="${METAS[p.key]||0}" inputmode="numeric">
          <div class="cfg-input-unit">/ mês</div>
        </div>
      </div>`).join('');

    const urnasCached = _hubUrnas !== null;
    const urnasContent = urnasCached
      ? _cfgUrnasRows(_hubUrnas)
      : '<div class="cfg-urnas-loading">Carregando urnas…</div>';

    cfgBod.innerHTML = `
      <div class="cfg-cols">
        <div class="cfg-sec">
          <div class="cfg-sec-hdr">
            <span class="cfg-sec-title">Metas das Pesquisas</span>
            <span class="ovx-band-rule"></span>
          </div>
          ${pesquisasRows}
        </div>
        <div class="cfg-vdiv"></div>
        <div class="cfg-sec">
          <div class="cfg-sec-hdr">
            <span class="cfg-sec-title">Metas das Urnas</span>
            <span class="ovx-band-rule"></span>
          </div>
          <div id="_cfgUrnasList" class="cfg-urna-grid">${urnasContent}</div>
        </div>
      </div>`;

    if (!urnasCached) {
      Promise.race([
        _loadUrnas(),
        new Promise(res => setTimeout(() => res([]), 4000))
      ]).then(u => {
        if (_hubUrnas === null) _hubUrnas = u || [];
        const el = document.getElementById('_cfgUrnasList');
        if (el) el.innerHTML = _cfgUrnasRows(_hubUrnas);
      }).catch(() => {
        if (_hubUrnas === null) _hubUrnas = [];
        const el = document.getElementById('_cfgUrnasList');
        if (el) el.innerHTML = _cfgUrnasRows([]);
      });
    }
  }

  function cfgClose() {
    const cfgOv = _cfgEl('cfgOverlay');
    if (!cfgOv) return;
    cfgOv.classList.remove('cfg-open');
    cfgOv.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  async function _saveCfg() {
    if (_gqMe.role !== 'master') { _cfgShow('Apenas masters podem salvar.', 'err'); return; }
    const btnSave = _cfgEl('btnCfgSave');
    const cfgMsg = _cfgEl('cfgMsg');
    if (btnSave) btnSave.disabled = true;
    if (cfgMsg) cfgMsg.style.display = 'none';
    const entries = [];

    CFG_PESQUISAS.forEach(p => {
      const el = document.getElementById('cfgP_' + p.key);
      if (el) entries.push({ tipo: p.key, valor: Math.max(0, parseInt(el.value) || 0) });
    });

    const urnas = _hubUrnas || [];
    urnas.forEach(u => {
      const el = document.getElementById('cfgU_' + u.id);
      if (el) entries.push({ tipo: 'urna:' + u.id, valor: Math.max(0, parseInt(el.value) || 0) });
    });

    try {
      const r = await fetch('/api/metas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entries }),
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'Erro');
      entries.forEach(e => { METAS[e.tipo] = e.valor; });
      _cfgShow('Salvo com sucesso ✓', 'ok');
      render('metas');
    } catch(e) {
      _cfgShow(e.message, 'err');
    } finally {
      if (btnSave) btnSave.disabled = false;
    }
  }

  document.getElementById('btnSettings')?.addEventListener('click', cfgOpen);
  document.addEventListener('click', e => {
    if (e.target.id === 'cfgClose') cfgClose();
    if (e.target.id === 'btnCfgSave') _saveCfg();
  });
  document.addEventListener('keydown', e => {
    const cfgOv = _cfgEl('cfgOverlay');
    if (e.key === 'Escape' && cfgOv?.classList.contains('cfg-open')) cfgClose();
  });
}

})();

// Desativa autocomplete em todos os inputs presentes e futuros
(function(){
  const off=()=>document.querySelectorAll('input,textarea,select').forEach(el=>{if(!el.dataset.acSet){el.setAttribute('autocomplete','off');el.dataset.acSet='1';}});
  off();
  new MutationObserver(off).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

        <span class="cfg-title">Configurações</span>

    </div>
  </div>
</div>
