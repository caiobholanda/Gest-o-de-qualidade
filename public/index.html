<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão da Qualidade — Gran Marquise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%239C5843'/><text x='16' y='23' font-size='19' fill='white' font-family='Georgia,serif' text-anchor='middle'>G</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
[data-theme="light"]{
  --bg:#EDE5D3;--surface:#FAF8F3;--surface2:#E8E0CE;
  --header-bg:rgba(250,248,243,0.96);
  --grad1:rgba(156,88,67,.08);--grad2:rgba(156,88,67,.04);
  --border:rgba(110,95,78,.18);--border-soft:rgba(110,95,78,.09);
  --text:#1C2820;--muted:#7A6B5A;--muted2:#8B6040;
  --gold:#9C5843;--gold-dark:#7E4636;--gold-dim:rgba(156,88,67,.11);--gold-dim2:rgba(156,88,67,.05);
  --success:#15705A;--success-dim:rgba(21,112,90,.11);
  --warn:#996442;--warn-dim:rgba(153,100,66,.11);
  --danger:#B85450;--danger-dim:rgba(184,84,80,.09);
}
[data-theme="dark"]{
  --bg:#181F1C;--surface:#222D28;--surface2:#131A17;
  --header-bg:rgba(24,31,28,0.97);
  --grad1:rgba(156,88,67,.11);--grad2:rgba(156,88,67,.05);
  --border:rgba(220,210,195,.14);--border-soft:rgba(220,210,195,.07);
  --text:#E8E0CE;--muted:#6E6055;--muted2:#B09070;
  --gold:#A86250;--gold-dark:#C07860;--gold-dim:rgba(168,98,80,.17);--gold-dim2:rgba(168,98,80,.07);
  --success:#22C46A;--success-dim:rgba(34,196,106,.13);
  --warn:#A07238;--warn-dim:rgba(160,114,56,.16);
  --danger:#D06058;--danger-dim:rgba(208,96,88,.15);
}
html,body{height:100%;font-family:'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(ellipse 1400px 700px at -5% -15%,var(--grad1),transparent 60%),
    radial-gradient(ellipse 900px 600px at 105% 10%,var(--grad2),transparent 55%),
    var(--bg);
  color:var(--text);min-height:100vh;min-height:100dvh
}

/* ── Header ── */
.hdr{
  position:sticky;top:0;z-index:100;
  height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 48px;
  background:var(--header-bg);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border-soft)
}
.hdr-brand{display:flex;align-items:center;gap:0;text-decoration:none}
.hdr-brand img{height:26px;width:auto;opacity:.9;transition:opacity .2s}
[data-theme="dark"] .hdr-brand img{filter:brightness(0) invert(1);opacity:.8}
.hdr-brand:hover img{opacity:1}
.hdr-sep{width:1px;height:18px;background:var(--border);margin:0 16px;flex-shrink:0}
.hdr-brand em{
  font-family:'Helvetica Neue',Arial,sans-serif;font-style:normal;font-weight:400;
  font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)
}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-avatar{width:26px;height:26px;border-radius:50%;overflow:hidden;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--muted);background:var(--surface2)}
/* display:flex acima venceria o [hidden] do UA stylesheet */
.hdr-avatar[hidden]{display:none}
.hdr-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.hdr-ts{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);
  background:var(--surface2);border:1px solid var(--border-soft);
  border-radius:6px;padding:4px 10px;letter-spacing:.03em
}
.btn-icon{
  background:none;border:1px solid var(--border-soft);border-radius:7px;
  padding:6px 10px;cursor:pointer;color:var(--muted);font-size:.8rem;
  transition:border-color .18s,color .18s;line-height:1
}
.btn-icon:hover{border-color:var(--gold);color:var(--gold)}
.btn-sair{
  font-family:'Helvetica Neue',Arial,sans-serif;
  font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);background:transparent;
  border:1px solid var(--border-soft);border-radius:7px;
  padding:7px 14px;cursor:pointer;transition:border-color .18s,color .18s
}
.btn-sair:hover{border-color:var(--gold);color:var(--gold)}
.btn-nova-pesquisa{
  font-family:'Helvetica Neue',Arial,sans-serif;
  font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#F5EFE5;background:var(--gold);border:none;
  border-radius:7px;padding:8px 18px;cursor:pointer;
  transition:background .18s,transform .1s;white-space:nowrap
}
.btn-nova-pesquisa:hover{background:var(--gold-dark)}
.btn-nova-pesquisa:active{transform:scale(.97)}
.ev-soc-pills{display:flex;gap:8px;margin:8px 0 24px;flex-wrap:wrap}
.ev-soc-pill{
  padding:5px 18px;border-radius:7px;border:1px solid var(--border-soft);
  background:transparent;cursor:pointer;color:var(--muted);
  font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  transition:background .15s,border-color .15s,color .15s;line-height:1.6
}
.ev-soc-pill.active{background:var(--gold);border-color:var(--gold);color:#fff}
.ev-soc-pill:not(.active):hover{border-color:var(--gold);color:var(--gold)}
.btn-edit-local{
  background:none;border:1px solid var(--border-soft);border-radius:6px;
  width:28px;height:28px;cursor:pointer;color:var(--muted);font-size:.85rem;
  display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s
}
.btn-edit-local:hover{border-color:var(--gold);color:var(--gold)}

/* ── Tabs ── */
.tabs{
  display:flex;gap:0;padding:0 48px;
  border-bottom:1px solid var(--border-soft);
  background:var(--header-bg);
  backdrop-filter:blur(24px)
}
.tab{
  padding:13px 0 11px;margin-right:28px;
  font-size:.65rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);border-bottom:2px solid transparent;
  margin-bottom:-1px;cursor:pointer;transition:color .18s,border-color .18s
}
.tab.tab-active{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.tab-active){color:var(--gold-dark)}

/* ── Overview ── */
@keyframes _barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes _rowIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ── Visão Geral · ledger editorial ── */
.ovx-hero{display:grid;grid-template-columns:minmax(250px,.85fr) 1px 1.35fr;gap:0 44px;align-items:center;padding:38px 8px 44px;border-bottom:1px solid var(--border-soft);margin-bottom:46px;animation:_rowIn .5s cubic-bezier(.16,1,.3,1) both}
.ovx-hero-num{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:200;font-size:5.6rem;line-height:.95;color:var(--text);letter-spacing:-.03em}
.ovx-hero-num em{font-style:normal;font-size:1.7rem;color:var(--gold);margin-left:8px;font-weight:300;letter-spacing:.02em}
.ovx-hero-sub{font-size:.84rem;color:var(--muted);margin-top:12px}
.ovx-hero-div{width:1px;align-self:stretch;background:linear-gradient(to bottom,transparent,var(--gold-dim) 18%,var(--gold-dim) 82%,transparent)}
.ov-tipo-row{display:grid;grid-template-columns:118px 1fr 48px;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.ov-tipo-row:last-child{border-bottom:0}
.ov-tipo-name{font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ov-tipo-bar{height:2px;background:var(--border-soft);border-radius:2px;overflow:hidden}
.ov-tipo-bar-fill{height:100%;background:var(--gold);border-radius:2px;transform-origin:left;animation:_barIn .75s cubic-bezier(.16,1,.3,1) both}
.ov-tipo-count{font-size:.92rem;font-weight:600;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}

.ovx-band{margin-bottom:52px}
.ovx-band-hd{display:flex;align-items:baseline;gap:18px;margin-bottom:6px}
.ovx-band-hd .eyebrow{flex-shrink:0}
.ovx-band-rule{flex:1;height:1px;background:linear-gradient(to right,var(--gold-dim),transparent);transform:translateY(-3px)}
.ovx-band-kpi{font-size:.98rem;font-weight:600;color:var(--gold);flex-shrink:0}
.ovx-band-kpi small{font-size:.72rem;font-weight:400;color:var(--muted);margin-left:5px}

.ovx-ledger{display:flex;flex-direction:column}
.ov-card{display:grid;grid-template-columns:minmax(150px,220px) 86px 1fr 54px minmax(120px,150px);align-items:center;gap:18px;padding:15px 10px;border-bottom:1px solid var(--border-soft);cursor:pointer;position:relative;transition:background .18s;animation:_rowIn .5s cubic-bezier(.16,1,.3,1) both}
.ov-card:nth-child(2){animation-delay:.05s}.ov-card:nth-child(3){animation-delay:.1s}.ov-card:nth-child(4){animation-delay:.15s}.ov-card:nth-child(5){animation-delay:.2s}
.ov-card:last-child{border-bottom:0}
.ov-card[data-goto]:hover{background:var(--gold-dim2)}
.ov-card::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:transparent}
.ov-card.ok::before{background:var(--success)}
.ov-card.mid::before{background:var(--warn)}
.ov-card.low::before{background:var(--danger)}
.ovx-row-label{font-size:.92rem;font-weight:500;color:var(--text);padding-left:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovx-row-frac{font-size:.98rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ovx-row-frac b{font-size:1.18rem;font-weight:600;color:var(--text)}
.ovx-row-bar{height:2px;background:var(--border-soft);border-radius:2px;overflow:hidden}
.ovx-row-bar i{display:block;height:100%;border-radius:2px;background:var(--gold);transform-origin:left;animation:_barIn .8s cubic-bezier(.16,1,.3,1) both}
.ovx-row-bar i.ok{background:var(--success)}
.ovx-row-bar i.mid{background:var(--warn)}
.ovx-row-bar i.low{background:var(--danger)}
.ovx-row-pct{font-size:.84rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.ovx-row-pct.ok{color:var(--success)}
.ovx-row-pct.mid{color:var(--warn)}
.ovx-row-pct.low{color:var(--danger)}
.ovx-row-status{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted2);text-align:right;white-space:nowrap}
.ovx-row-status.ok{color:var(--success)}
.ovx-row-status.mid{color:var(--warn)}
.ovx-row-status.low{color:var(--danger)}

.ovx-zeros{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:16px 10px 0}
.ovx-zeros-label{font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--muted2);margin-right:6px}
.ovx-pill{font-size:.76rem;color:var(--muted);padding:4px 11px;border:1px solid var(--border-soft);border-radius:20px;background:var(--surface);white-space:nowrap}

/* ── Layout ── */
.main{max-width:1260px;margin:0 auto;padding:52px 48px 100px}
.eyebrow{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* ── KPI grid ── */
.kpis-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.kpi-grid{display:grid;grid-template-columns:1.55fr 1fr 1fr 1fr 1.2fr;gap:14px;margin-bottom:80px}
/* Variante compacta usada nas abas locais (3 KPIs). Substitui o antigo
   style inline que impedia as media queries de colapsarem o grid. */
.kpi-grid--compact{grid-template-columns:repeat(3,1fr);max-width:560px;margin-bottom:52px}
.kpi{
  background:var(--surface);border:1px solid var(--border-soft);
  border-radius:14px;padding:22px 24px;
  display:flex;flex-direction:column;justify-content:space-between;gap:16px;
  transition:border-color .2s,box-shadow .2s
}
.kpi:hover{border-color:var(--border);box-shadow:0 4px 28px var(--gold-dim)}
.kpi.hero{
  border-radius:16px;border-color:var(--border);
  padding:28px 30px 24px;
  background:linear-gradient(140deg,var(--surface) 0%,var(--gold-dim2) 100%);
  box-shadow:0 6px 32px var(--gold-dim)
}
.kpi.warn{
  background:linear-gradient(160deg,var(--gold-dim2),transparent 65%),var(--surface);
  border-color:rgba(156,88,67,.22)
}
.kpi-label{font-size:.59rem;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.kpi-warn-label{display:flex;align-items:center;gap:8px}
.kpi-warn-dot{
  width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;
  animation:dotPulse 2.6s ease-in-out infinite
}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.7)}}
.kpi-warn-label .kpi-label{color:var(--gold-dark)}
.kpi-hero-val{
  font-family:'Helvetica Neue',Arial,sans-serif;font-weight:200;
  font-size:4.2rem;line-height:1;color:var(--text);margin-top:12px;letter-spacing:-.03em
}
.kpi-hero-val span{font-size:2.1rem;color:var(--gold);font-weight:300}
.kpi-hero-line{width:28px;height:2px;background:var(--gold);margin-top:12px;opacity:.6}
.kpi-hero-sub{font-size:.7rem;color:var(--muted);margin-top:8px;letter-spacing:.03em}
.kpi-val{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:2rem;line-height:1;color:var(--text);letter-spacing:-.01em}
.kpi-val span{font-size:1.1rem;color:var(--muted);margin-left:2px}
.kpi-warn-val{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:2rem;line-height:1;color:var(--gold-dark)}
.kpi-sub{font-size:.64rem;color:var(--muted);margin-top:5px;letter-spacing:.02em}
.kpi-warn-sub{font-size:.64rem;color:var(--muted);margin-top:5px}

/* ── Sections ── */
.sec-hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:8px}
.sec-hdr-left{display:flex;align-items:baseline;gap:16px}
.sec-num{
  font-family:'Helvetica Neue',Arial,sans-serif;font-weight:200;
  font-size:4rem;line-height:.86;color:var(--gold);opacity:.35;letter-spacing:-.04em
}
.sec-title{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:1.65rem;color:var(--text);line-height:1.2;letter-spacing:-.01em}
.sec-legend{display:flex;gap:18px;padding-bottom:6px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.66rem;color:var(--muted);letter-spacing:.03em}
.legend-swatch{width:12px;height:7px;border-radius:2px;flex-shrink:0}
.sec-divider{height:1px;background:var(--border-soft);margin-bottom:28px}

/* ── Question rows ── */
.q-list{display:flex;flex-direction:column;margin-bottom:80px}
.q-row{
  display:grid;grid-template-columns:380px 1fr 130px;align-items:center;gap:32px;
  padding:16px 12px;border-radius:10px;
  border-bottom:1px solid var(--border-soft);transition:background .15s
}
.q-row:hover{background:var(--surface)}
.q-text{font-size:.9rem;color:var(--text);line-height:1.45;letter-spacing:.005em}
.q-bar{display:flex;gap:2px;height:10px;border-radius:4px;overflow:hidden}
.q-seg{border-radius:0}
.q-seg:first-child{border-radius:4px 0 0 4px}
.q-seg:last-child{border-radius:0 4px 4px 0}
.q-seg:only-child{border-radius:4px}
.q-nota{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;font-size:1.55rem;color:var(--text);text-align:right;letter-spacing:-.02em}
.q-resp{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);margin-top:3px;text-align:right}

/* ── Comments ── */
.comment-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:80px}
.comment-col-label{font-size:.59rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:12px}
.comment-cards{display:flex;flex-direction:column;gap:12px}
.comment-card{
  background:var(--surface);border:1px solid var(--border-soft);
  border-radius:12px;padding:18px 20px 14px;transition:all .2s
}
.comment-card:hover{border-color:var(--border);box-shadow:0 6px 24px var(--gold-dim);transform:translateY(-2px)}
.comment-qm{font-family:Georgia,serif;font-size:2.6rem;line-height:.85;color:var(--gold);opacity:.45;margin-bottom:4px}
.comment-text{font-family:'Helvetica Neue',Arial,sans-serif;font-style:italic;font-size:.97rem;color:var(--text);line-height:1.5;margin-bottom:10px}
.comment-meta{font-size:.59rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.comment-meta .mono{font-family:'JetBrains Mono',monospace;letter-spacing:0;text-transform:none}

/* ── Filters ── */
.filter-shell{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;margin-bottom:46px;overflow:hidden;
  box-shadow:0 4px 24px var(--gold-dim)
}
.filter-head{
  display:flex;align-items:center;gap:12px;
  padding:12px 24px;border-bottom:1px solid var(--border-soft);
  background:var(--surface2)
}
.filter-num{font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:600;color:var(--gold);letter-spacing:.08em}
.filter-label{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--text)}
.filter-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.filter-hint{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);letter-spacing:.05em;white-space:nowrap}
.filter-box{display:flex;align-items:stretch;flex-wrap:wrap}
.filter-group{
  display:flex;flex-direction:column;justify-content:center;gap:8px;
  padding:15px 22px 13px;border-right:1px solid var(--border-soft);
  position:relative
}
.filter-group::after{
  content:'';position:absolute;left:22px;right:22px;bottom:0;height:2px;
  background:var(--gold);transform:scaleX(0);transform-origin:left;
  transition:transform .28s cubic-bezier(.16,1,.3,1)
}
.filter-group:focus-within::after{transform:scaleX(1)}
.filter-group .fl{font-size:.57rem;letter-spacing:.17em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.fi{display:flex;align-items:center;gap:9px}
.fi input,.fi select,.fi-range input{
  background:none;border:none;outline:none;appearance:none;-webkit-appearance:none;
  font-family:'Helvetica Neue',Arial,sans-serif;font-size:.85rem;color:var(--text);
  cursor:pointer;padding:2px 0;min-width:0
}
.fi select option{background:var(--surface);color:var(--text)}
.fi-chev,.fi-lupa{flex:none;color:var(--muted);pointer-events:none;transition:color .18s}
.filter-group:focus-within .fi-chev,.filter-group:focus-within .fi-lupa{color:var(--gold)}
.fi-range{display:flex;align-items:center;gap:10px}
.fi-arrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--gold);flex:none;user-select:none}
.filter-flex{flex:1;min-width:220px}
.filter-flex .fi{width:100%}
.filter-flex .fi input{flex:1}
.btn-gold{
  font-family:'Helvetica Neue',Arial,sans-serif;
  font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#F5EFE5;background:var(--gold);border:none;
  border-radius:8px;padding:12px 28px;cursor:pointer;
  transition:background .18s,transform .1s;align-self:flex-end
}
.btn-gold:hover{background:var(--gold-dark)}
.btn-gold:active{transform:scale(.98)}
.btn-filtrar{align-self:stretch;border-radius:0;padding:0 36px;margin-left:auto;min-height:52px;letter-spacing:.16em}
.btn-filtrar:active{transform:none}

/* ── Chips ── */
.chips{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:11px 24px;border-top:1px solid var(--border-soft)
}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--gold-dim);border:1px solid rgba(156,88,67,.18);
  border-radius:999px;padding:4px 12px;
  font-size:.67rem;color:var(--gold-dark);font-weight:600;letter-spacing:.04em
}
.chip-x{cursor:pointer;opacity:.55;transition:opacity .2s}
.chip-x:hover{opacity:1}

/* ── Table ── */
.tbl-hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.tbl-title{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:1.4rem;color:var(--text);letter-spacing:-.01em}
.tbl-count{
  font-family:'JetBrains Mono',monospace;font-size:.64rem;font-weight:600;
  color:var(--gold-dark);background:var(--gold-dim);
  border:1px solid rgba(156,88,67,.18);border-radius:999px;
  padding:4px 13px;letter-spacing:.05em;white-space:nowrap;margin-bottom:4px
}
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow-x:auto;overflow-y:hidden;box-shadow:0 4px 24px var(--gold-dim)}
.tbl-head{display:grid;grid-template-columns:110px 1.35fr 1.75fr 118px 104px 96px 60px;gap:16px;align-items:center;padding:13px 24px;border-bottom:1px solid var(--border);background:var(--surface2)}
.tbl-head div{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tbl-row{display:grid;grid-template-columns:110px 1.35fr 1.75fr 118px 104px 96px 60px;gap:16px;align-items:center;padding:13px 24px;border-bottom:1px solid var(--border-soft);transition:background .15s,box-shadow .15s;cursor:pointer}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:var(--gold-dim2);box-shadow:inset 3px 0 0 var(--gold)}
.tbl-date{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted)}
.tbl-nome{font-size:.87rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-email{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-tipo span{display:inline-block;font-size:.65rem;font-weight:600;letter-spacing:.03em;color:var(--muted);border:1px solid var(--border-soft);border-radius:999px;padding:3px 10px;background:var(--surface2)}
.tbl-orig{font-size:.8rem;color:var(--muted)}
.pgn{display:flex;align-items:center;justify-content:center;gap:20px;padding:22px 0}
.pgn-btn{
  font-family:'Helvetica Neue',Arial,sans-serif;
  font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:none;border:1px solid var(--border-soft);border-radius:999px;
  padding:8px 18px;cursor:pointer;color:var(--muted);
  transition:border-color .18s,color .18s
}
.pgn-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pgn-btn:disabled{opacity:.35;cursor:default}
.pgn-info{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.score{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:4px 10px;min-width:46px;text-align:center;border:1px solid transparent}
.score.alto{color:var(--success);background:var(--success-dim)}
.score.medio{color:var(--gold-dark);background:var(--gold-dim)}
.score.baixo{color:var(--danger);background:var(--danger-dim)}
.score.nenhum{color:var(--muted);background:transparent;border-color:var(--border-soft)}
.score.warn{color:var(--warn);background:var(--warn-dim)}
.tbl-ver span{
  display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(156,88,67,.28);border-radius:999px;
  padding:4px 13px;cursor:pointer;transition:background .18s,color .18s,border-color .18s
}
.tbl-row:hover .tbl-ver span{background:var(--gold);border-color:var(--gold);color:#F5EFE5}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:.88rem}

/* ── Picker overlay ── */
#psOverlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:none;overflow-y:auto}
#pickerOverlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px}
#pickerOverlay.open{display:flex}
#pickerModal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:32px 28px 24px;width:100%;max-width:460px;
  box-shadow:0 48px 120px rgba(0,0,0,.4);position:relative
}
[data-theme="dark"] #pickerModal{background:#1A2420}
#pickerModal .picker-title{font-family:'Helvetica Neue',Arial,sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 20px}
#pickerModal .picker-close{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--border-soft);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .18s;line-height:1}
#pickerModal .picker-close:hover{border-color:var(--gold);color:var(--gold)}
#pickerModal .picker-list{display:flex;flex-direction:column;gap:5px}
#pickerModal .picker-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-radius:10px;border:1px solid var(--border-soft);background:none;cursor:pointer;text-align:left;font-family:'Helvetica Neue',Arial,sans-serif;font-size:.88rem;font-weight:400;color:var(--text);transition:background .15s,border-color .15s}
#pickerModal .picker-item:hover:not(.picker-soon){background:var(--gold-dim);border-color:rgba(156,88,67,.25)}
#pickerModal .picker-item.picker-soon{cursor:default;opacity:.4}
#pickerModal .picker-badge{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface2);border-radius:4px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
#pickerModal .picker-arrow{color:var(--gold);flex-shrink:0;font-size:.85rem;opacity:.7}

/* ── psModal (survey forms — own variable scope, kept intact) ── */
#psModal{--bg:#ECE4D2;--bg-alt:#E3DACC;--bg-surf:#F5EFE2;--fg:#1A1A1A;--fg-2:#4A4A4A;--fg-3:#6B6B6B;--fg-4:#9B9B9B;--border:#B8B8B8;--bord-s:#C8B89A;--gold:#9C5843;--gold-s:#996442;--gold-d:#7A4334;--ui:#9C5843;--ui-soft:#996442;--ui-dark:#7A4334;--err:#B85450;background:var(--bg);color:var(--fg);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;width:100%;max-width:820px;margin:0 auto;box-shadow:0 24px 80px rgba(0,0,0,.35);position:relative}
[data-theme="dark"] #psModal{--bg:#202C28;--bg-alt:#293630;--bg-surf:#2F3D38;--fg:#ECE4D2;--fg-2:#C8B89A;--fg-3:#8A7B6A;--fg-4:#6A5E56;--border:#3F524B;--bord-s:#4A5E57;--gold:#C4916A;--gold-s:#B87A52;--gold-d:#B87060;--ui:#C4916A;--ui-soft:#B87A52;--ui-dark:#B87060}
.ps-sticky-hdr{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 24px 12px;transition:background .6s cubic-bezier(0.16,1,0.3,1)}
.ps-sticky-top{max-width:720px;margin:0 auto 8px;display:flex;align-items:center;justify-content:flex-end}
.ps-close{background:none;border:1px solid var(--border);width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--fg-3);font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s;line-height:1}
.ps-close:hover{border-color:var(--ui);color:var(--ui)}
#psModal .progress-inner{max-width:720px;margin:0 auto;display:flex;gap:8px}
#psModal .trace{height:2px;flex:1;background:var(--bg-alt);overflow:hidden}
#psModal .tf{height:100%;background:var(--ui);width:0;transition:width .4s cubic-bezier(0.16,1,0.3,1)}
#psModal .form-wrap{max-width:720px;margin:0 auto;padding:24px 24px 36px}
@media(min-width:768px){#psModal .form-wrap{max-width:860px;padding:28px 40px 44px}}
#psModal .form-wrap>section,#psModal .form-wrap>header,#psModal .form-wrap>footer{margin-bottom:16px}
@media(min-width:768px){#psModal .form-wrap>section{margin-bottom:20px}}
#psModal .form-title{font-weight:500;font-size:24px;color:var(--fg);letter-spacing:.01em;margin:0 0 14px;text-align:center}
@media(max-width:600px){#psModal .form-title{font-size:23px}}
#psModal .form-intro{font-size:14.5px;line-height:1.75;color:var(--fg-2);max-width:620px;margin:0 auto 14px;text-align:center}
#psModal .form-intro.en{font-size:13px;color:var(--fg-3);font-style:italic}
#psModal .en{font-style:italic;color:var(--fg-3)}
#psModal .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
#psModal .field-full{grid-column:1/-1}
#psModal .field{position:relative}
#psModal .field label{display:block;margin-bottom:5px;line-height:1.3}
#psModal .field-label-pt{font-size:13.5px;color:var(--fg-2);letter-spacing:.005em}
#psModal .field-label-en{font-style:italic;color:var(--fg-3);font-size:12px}
#psModal .field input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--border);padding:8px 2px;font-size:16px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--fg);outline:none;transition:border-color .5s cubic-bezier(0.16,1,0.3,1)}
#psModal .field input::placeholder{color:var(--border)}
#psModal .fill{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ui-soft);transform:scaleX(0);transform-origin:center;transition:transform .5s cubic-bezier(0.16,1,0.3,1)}
#psModal .field:focus-within .fill{transform:scaleX(1)}
#psModal .comment-field{margin-top:6px}
#psModal .sec-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 10px;margin-bottom:8px}
#psModal .sec-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ui);letter-spacing:.1em}
#psModal .sec-title{font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg)}
#psModal .sec-title-en{font-size:14px;letter-spacing:.08em}
#psModal .scale-bar{background:var(--gold);min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;flex-wrap:wrap;margin-bottom:8px}
#psModal .scale-bar-title{color:#fff;font-weight:500;font-size:16px;display:flex;flex-direction:column;line-height:1.25}
#psModal .scale-bar-legend{display:flex;gap:18px}
#psModal .scale-legend-item{display:flex;flex-direction:column;align-items:center;gap:3px}
#psModal .scale-legend-label{display:flex;flex-direction:column;align-items:center;color:#fff;font-size:11.5px;font-weight:500;line-height:1.2}
@media(max-width:600px){#psModal .scale-bar-legend{gap:10px}}
#psModal .rating-list{display:flex;flex-direction:column}
#psModal .rating-row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:3px 0;border-bottom:1px solid var(--bg-alt)}
#psModal .rating-text{flex:1;line-height:1.55}
#psModal .rating-smileys{display:flex;gap:6px;flex:none}
#psModal .smiley-btn{display:flex;align-items:center;justify-content:center;padding:3px;border:1px solid transparent;border-radius:9999px;background:none;cursor:pointer;transition:border-color .35s cubic-bezier(0.16,1,0.3,1)}
#psModal .smiley-btn:hover{border-color:var(--ui-soft)}
#psModal .smiley-btn.selected{border-color:var(--gold)}
#psModal .smiley-btn.selected svg{animation:psSmBounce .25s cubic-bezier(0.16,1,0.3,1)}
@keyframes psSmBounce{0%{transform:translateY(0)}45%{transform:translateY(-3px)}100%{transform:translateY(0)}}
#psModal .radio-list{display:flex;flex-direction:column;gap:1px}
#psModal .radio-opt{display:flex;align-items:flex-start;gap:14px;background:none;border:0;cursor:pointer;font-size:16px;color:var(--fg);padding:1px 0;text-align:left;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;line-height:1.5;width:100%}
#psModal .radio-dot{width:18px;height:18px;border-radius:9999px;border:1.5px solid var(--border);position:relative;flex:none;margin-top:2px;transition:border-color .35s cubic-bezier(0.16,1,0.3,1)}
#psModal .radio-dot.on{border-color:var(--ui)}
#psModal .radio-dot.on::after{content:'';position:absolute;inset:3px;border-radius:9999px;background:var(--ui);animation:psDotIn .25s cubic-bezier(0.16,1,0.3,1)}
@keyframes psDotIn{from{transform:scale(0)}to{transform:scale(1)}}
#psModal .inline-reveal{margin:10px 0 6px 30px;max-width:440px}
#psModal .client-type{display:flex;gap:10px;flex-wrap:wrap}
#psModal .submit-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:56px;gap:14px}
#psModal .submit-btn{position:relative;overflow:hidden;height:56px;width:280px;max-width:100%;background:var(--ui);color:#fff;border:0;cursor:pointer;font-size:14px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;transition:background-color .4s cubic-bezier(0.16,1,0.3,1),opacity .3s}
#psModal .submit-btn:hover:not(:disabled){background:var(--ui-dark)}
#psModal .submit-btn:disabled{opacity:.6;cursor:not-allowed}
#psModal .submit-btn::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(0.16,1,0.3,1)}
#psModal .submit-btn:hover:not(:disabled)::after{transform:scaleX(1)}
#psModal .submit-err{color:var(--err);font-size:13.5px;text-align:center;display:none}
#psModal .form-foot{font-size:15px;line-height:1.7;color:var(--fg-2);text-align:center}
#psModal .page-foot{text-align:center;font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:32px}
@media(max-width:680px){
  #psModal .form-wrap{padding:32px 18px 60px}
  #psModal .field-grid{grid-template-columns:1fr;gap:26px}
  #psModal .rating-row{flex-direction:column;align-items:flex-start;gap:14px}
  #psModal .rating-smileys{gap:14px}
  #psModal .client-type{flex-direction:column;gap:4px}
  #psModal .scale-bar-legend{gap:10px}
}
#psModal .btn-mark-all{display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid var(--bord-s);border-radius:9999px;padding:7px 18px;font-size:12px;font-weight:500;color:var(--gold-s);cursor:pointer;transition:all .25s;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.04em;flex-shrink:0}
#psModal .btn-mark-all:hover{background:var(--gold-d);border-color:var(--gold-d);color:#fff}
#psModal .ps-field-err{font-size:11.5px;color:var(--err);margin-top:5px;display:none;line-height:1.3}
#psModal .ps-combo{position:relative}
#psModal .ps-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg-surf);border:1px solid var(--bord-s);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.2);max-height:220px;overflow-y:auto;z-index:30}
#psModal .ps-dropdown-item{padding:10px 16px;font-size:14.5px;color:var(--fg);cursor:pointer;transition:background .15s;border-bottom:1px solid var(--bg-alt)}
#psModal .ps-dropdown-item:last-child{border-bottom:none}
#psModal .ps-dropdown-item:hover{background:var(--gold-d);color:#fff}
#psModal .ps-dropdown-empty{padding:10px 16px;font-size:13.5px;color:var(--fg-3);font-style:italic}

/* ── Responsive ── */
@media(max-width:900px){
  .hdr{padding:0 20px}
  .tabs{padding:0 20px;overflow-x:auto;scrollbar-width:none}
  /* margin-bottom:-1px seria recortado pelo scroll container */
  .tab{white-space:nowrap;flex:none;margin-bottom:0}
  .main{padding:28px 20px 60px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .ov-card{grid-template-columns:minmax(110px,1fr) 76px 1fr 46px;gap:12px}
  .ovx-row-status{display:none}
  .q-row{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:10px 12px}
  .q-bar{grid-column:1/-1}
  .comment-grid{grid-template-columns:1fr}
  .tbl-head,.tbl-row{grid-template-columns:90px 1fr 60px 46px}
  .tbl-email,.tbl-tipo,.tbl-orig{display:none}
  /* Cabecalho da tabela usa <div> sem classe: esconde as mesmas colunas
     (3=E-mail, 4=Tipo, 5=Inserido por) para alinhar com as linhas. */
  .tbl-head div:nth-child(3),.tbl-head div:nth-child(4),.tbl-head div:nth-child(5){display:none}
  .sec-legend{flex-wrap:wrap;gap:10px}
  .q-list{margin-bottom:48px}
  .filter-group{padding:13px 18px 11px}
  .filter-group::after{left:18px;right:18px}
  .btn-filtrar{padding:0 26px}
}
@media(max-width:680px){
  .ovx-hero{grid-template-columns:1fr;gap:26px;padding:20px 0 30px;margin-bottom:36px}
  .ovx-hero-div{display:none}
}
@media(max-width:480px){
  .hdr{padding:0 14px;height:52px}
  .hdr-brand em{display:none}
  .hdr-sep{display:none}
  .hdr-ts{display:none}
  .hdr-right{gap:8px}
  .btn-sair{padding:6px 10px;font-size:.66rem}
  .tabs{padding:0 14px}
  .tab{font-size:.65rem;padding:12px 0 10px}
  .main{padding:18px 14px 56px}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:44px}
  .kpi.hero{grid-column:1/-1}
  .kpi-hero-val{font-size:3.2rem}
  .kpi{padding:16px}
  .sec-num{font-size:2.6rem}
  .sec-title{font-size:1.25rem}
  .sec-legend{display:none}
  .q-row{padding:12px 8px;gap:8px 10px}
  .q-text{font-size:.84rem}
  .q-nota{font-size:1.3rem}
  .q-list{margin-bottom:40px}
  .comment-grid{margin-bottom:44px}
  .filter-shell{margin-bottom:32px}
  .filter-head{padding:11px 16px}
  .filter-box{flex-direction:column}
  .filter-group{width:100%;border-right:none;border-bottom:1px solid var(--border-soft);padding:12px 16px 11px}
  .filter-group::after{left:16px;right:16px}
  .fi,.fi-range{width:100%}
  .fi-range input{flex:1}
  .btn-filtrar{width:100%;margin-left:0;min-height:48px;padding:14px 0;text-align:center}
  .chips{padding:10px 16px}
  /* 4 colunas: data, nome, media/vazio, botao editar — as linhas geradas
     tem 4 celulas visiveis apos esconder e-mail/tipo/origem no MQ 900. */
  .tbl-head,.tbl-row{grid-template-columns:70px 1fr 50px 34px;gap:10px;padding:10px 12px}
  .tbl-wrap{border-radius:10px}
  .btn-nova-pesquisa{padding:8px 12px;font-size:.6rem;letter-spacing:.08em}
  .hdr-brand img{height:22px}
  .ovx-hero-num{font-size:4.4rem}
  .ov-card{grid-template-columns:1fr 70px 44px;gap:10px}
  .ovx-row-bar{display:none}
  .ov-tipo-row{grid-template-columns:84px 1fr 36px;gap:8px}
  .ov-tipo-name{white-space:normal}
  /* iOS Safari: inputs/selects com fonte <16px disparam zoom no foco. */
  .fi input,.fi select,.fi-range input{font-size:16px}
}
/* ── Settings Overlay ── */
.cfg-overlay{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .22s ease}
.cfg-overlay.cfg-open{opacity:1;pointer-events:all}
.cfg-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cfg-panel{position:relative;width:min(1080px,100%);max-height:96vh;background:var(--surface);border:1px solid var(--border-soft);border-radius:18px;display:flex;flex-direction:column;transform:translateY(16px) scale(.98);transition:transform .28s cubic-bezier(.16,1,.3,1);box-shadow:0 32px 90px rgba(0,0,0,.26);overflow:hidden}
.cfg-overlay.cfg-open .cfg-panel{transform:translateY(0) scale(1)}
.cfg-hdr{position:sticky;top:0;z-index:2;background:var(--surface);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-soft);flex-shrink:0}
.cfg-hdr-left{display:flex;align-items:center;gap:12px}
.cfg-gear-deco{width:28px;height:28px;background:var(--gold-dim);border:1px solid var(--gold-dim2);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.cfg-title{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text)}
.cfg-close{background:none;border:1px solid var(--border-soft);border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;flex-shrink:0}
.cfg-close:hover{border-color:var(--gold);color:var(--gold)}
.cfg-body{flex:1;overflow-y:auto;padding:18px 30px 20px;display:flex;flex-direction:column;justify-content:center}
.cfg-cols{display:grid;grid-template-columns:minmax(280px,330px) 1px 1fr;gap:0 40px;align-items:start}
.cfg-vdiv{width:1px;align-self:stretch;background:linear-gradient(to bottom,transparent,var(--gold-dim) 14%,var(--gold-dim) 86%,transparent)}
.cfg-urna-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 22px}
.cfg-urna-grid .cfg-row{padding:5px 8px;border-bottom:none}
.cfg-urna-grid .cfg-row-label{font-size:.9rem}
.cfg-urna-grid .cfg-input{width:60px;font-size:.98rem;padding:7px 4px}
.cfg-urna-grid .cfg-input-unit{font-size:.66rem}
.cfg-sec{margin-bottom:0}
.cfg-sec-hdr{display:flex;align-items:baseline;gap:16px;margin-bottom:12px}
.cfg-sec-hdr .ovx-band-rule{transform:translateY(-3px)}
.cfg-sec-title{font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.cfg-group-cap{grid-column:1/-1;font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);margin:9px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--gold-dim)}
.cfg-group-cap:first-child{margin-top:0}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-bottom:1px solid var(--border-soft);gap:14px;border-radius:7px;transition:background .15s}
.cfg-row:hover{background:var(--gold-dim2)}
.cfg-row:last-child{border-bottom:none}
.cfg-row-label{font-size:.98rem;color:var(--text);flex:1;line-height:1.35}
.cfg-row-sub{font-size:.74rem;color:var(--muted);margin-top:1px}
.cfg-input{width:70px;padding:9px 5px;border:1px solid var(--border-soft);border-radius:8px;background:var(--surface2);color:var(--text);font-size:1.05rem;text-align:center;outline:none;transition:border-color .18s,box-shadow .18s;font-variant-numeric:tabular-nums}
.cfg-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.cfg-input-unit{font-size:.7rem;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.cfg-input-wrap{display:flex;align-items:center;gap:7px;flex-shrink:0}
.cfg-footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border-soft);padding:10px 26px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.cfg-footer .cfg-msg{flex:1}
.btn-cfg-save{margin-left:auto;padding:12px 30px;background:var(--gold);color:#fff;border:none;border-radius:9px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .15s,opacity .15s;flex-shrink:0}
.btn-cfg-save:hover{background:var(--gold-dark)}
.btn-cfg-save:disabled{opacity:.45;cursor:not-allowed}
.cfg-msg{font-size:.78rem;padding:8px 12px;border-radius:7px;display:none}
.cfg-msg.ok{color:var(--success);background:var(--success-dim)}
.cfg-msg.err{color:var(--danger);background:var(--danger-dim)}
.cfg-urnas-loading{grid-column:1/-1;padding:20px 0;text-align:center;color:var(--muted);font-size:.82rem}
@media(max-width:1120px){.cfg-urna-grid{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.cfg-cols{grid-template-columns:1fr;gap:26px 0}.cfg-vdiv{display:none}.cfg-overlay{padding:12px}}
@media(max-width:560px){.cfg-urna-grid{grid-template-columns:1fr}}
.admin-wrap{max-width:700px;margin:32px auto;padding:0 20px}
.admin-section{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;margin-bottom:20px}
.admin-section-hdr{padding:14px 18px;border-bottom:1px solid var(--border-soft);font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.admin-row{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border-soft);gap:12px}
.admin-row:last-child{border-bottom:none}
.admin-email{font-size:.9rem;color:var(--text);word-break:break-all}
.admin-meta{font-size:.67rem;color:var(--muted);margin-top:2px}
.nivel-badge{padding:2px 10px;border-radius:10px;font-size:.65rem;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.nivel-badge.operador{background:var(--success-dim);color:var(--success)}
.nivel-badge.leitura{background:var(--surface2);color:var(--muted)}
.btn-remover{background:none;border:1px solid var(--border-soft);border-radius:7px;padding:5px 12px;font-size:.72rem;color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s;white-space:nowrap}
.btn-remover:hover{border-color:var(--danger);color:var(--danger)}
.admin-add-row{display:flex;gap:10px;flex-wrap:wrap;padding:16px 18px}
.admin-add-row input,.admin-add-row select{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:.88rem;font-family:inherit;outline:none}
.admin-add-row input:focus,.admin-add-row select:focus{border-color:var(--gold)}
.btn-add-admin{padding:9px 20px;background:var(--gold);color:#fff;border:none;border-radius:8px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-add-admin:hover{background:var(--gold-dark)}
.btn-add-admin:disabled{opacity:.5;cursor:not-allowed}
.admin-msg{margin:0 18px 14px;font-size:.82rem}
</style>

<script>
(function(){
'use strict';
const body = document.body;
const saved = localStorage.getItem('gq_theme') || (document.cookie.match(/(?:^|;\s*)gq_theme=([^;]+)/)||[])[1] || 'light';
body.setAttribute('data-theme', saved);
const btn = document.getElementById('btnTheme');
btn.textContent = saved === 'dark' ? '☀' : '☾';
btn.onclick = () => {
  const t = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  body.setAttribute('data-theme', t);
  localStorage.setItem('gq_theme', t);
  btn.textContent = t === 'dark' ? '☀' : '☾';
};

function updateTs() {
  const now = new Date(), pad = n => String(n).padStart(2,'0');
  document.getElementById('ts').textContent =
    `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} · ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}
updateTs(); setInterval(updateTs, 60000);

let _gqMe = { email: '', role: '' };
Promise.all([
  fetch('/api/me').then(r=>r.json()).catch(()=>({})),
  fetch('/api/metas').then(r=>r.json()).catch(()=>({})),
]).then(([me, met]) => {
  if (me.ok) {
    _gqMe = me;
    if (me.role === 'master') {
      document.getElementById('tabAdmin').style.display = '';
      document.getElementById('btnSettings').style.display = '';
    }
    if (me.role === 'satisfacao') {
      document.getElementById('btnSettings').style.display = '';
    }
    if (me.role !== 'satisfacao' && me.role !== 'master') {
      const btn = document.getElementById('btnNovaPesquisa');
      if (btn) btn.style.display = 'none';
    }
    const av = document.getElementById('hdrAvatar');
    if (av) {
      av.hidden = false;
      av.title = me.nome || me.email || '';
      const img = document.createElement('img');
      img.alt = '';
      img.onerror = () => {
        const src = (me.nome || '').trim();
        const ini = src
          ? src.split(/\s+/).slice(0,2).map(p=>p[0]).join('')
          : (me.email || '?')[0];
        av.textContent = ini.toUpperCase();
      };
      img.src = '/api/me/foto';
      av.appendChild(img);
    }
  }
  if (met.ok && met.metas) {
    Object.assign(METAS, met.metas);
    if (activeTab === 'overview') render('metas');
  }
});

const LIMIT=20;
let METAS={spa:30,geral:20,pdvs:15,'eventos-corp':5,'eventos-soc':5};
const state = { from:'', to:'', tipo:'', origem:'', q:'', page:1, totalPages:1, periodCustom:false };
(function(){
  try {
    const s=JSON.parse(localStorage.getItem('gq_filters')||'{}');
    ['from','to','tipo','origem','q','periodCustom'].forEach(k=>{ if(k in s) state[k]=s[k]; });
    if(s.page) state.page=s.page;
  } catch(e){}
})();
let _ovMes='';
function _fmtMes(ym){const M=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];const[y,m]=ym.split('-');return `${M[parseInt(m)-1]} ${y}`;}
function _mesLastDay(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
function _addMonths(ym,n){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);const p=v=>String(v).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}`;}


function _localDateStr(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function esc(s){ const d=document.createElement('div');d.textContent=s||'';return d.innerHTML; }
function scoreClass(s){ if(s==='—')return'nenhum'; if(s===null||s===undefined||s==='')return'nenhum'; const n=parseInt(s); if(n>=85)return'alto'; if(n>=60)return'medio'; return'baixo'; }
function _extOrigem(app){ const l={'spa':'Gran SPA · site'}[app]||'Site externo'; return `<span style="display:inline-flex;align-items:center;gap:3px;font-size:.68rem;color:var(--muted2);background:var(--surface2);border:1px solid var(--border-soft);border-radius:10px;padding:2px 8px;letter-spacing:.02em;font-style:italic">↗ ${esc(l)}</span>`; }

const _RATINGS=[{key:'otimo',pt:'Ótimo',type:'great'},{key:'bom',pt:'Bom',type:'good'},{key:'regular',pt:'Regular',type:'fair'},{key:'ruim',pt:'Ruim',type:'poor'}];
const _MOUTHS={great:'M11.5 23 Q20 33 28.5 23',good:'M12.5 24.5 Q20 29.5 27.5 24.5',fair:'M13 26 H27',poor:'M12.5 28.5 Q20 22.5 27.5 28.5'};
const _SEC1=[{key:'servicos_expectativa',pt:'A expectativa do tratamento'},{key:'servicos_explicacao',pt:'Explicação sobre benefícios e procedimentos'},{key:'servicos_atitude',pt:'Atitude e qualidade dos serviços'},{key:'servicos_tecnica',pt:'Técnica e habilidade da massoterapeuta'}];
const _SEC2=[{key:'instalacoes_conforto',pt:'Conforto e conservação do SPA'},{key:'instalacoes_organizacao',pt:'Organização e atmosfera do ambiente'},{key:'instalacoes_conveniencia',pt:'Itens de conveniência (roupões, toalhas)'}];
function _smly(type,filled,size,color){color=color||'#9A9A9A';const stroke=filled?'#fff':color,fill=filled?'var(--gold)':'none';return `<svg viewBox="0 0 40 40" width="${size}" height="${size}" fill="none"><circle cx="20" cy="20" r="17" fill="${fill}" stroke="${stroke}" stroke-width="2"/><circle cx="14.6" cy="16.4" r="1.7" fill="${stroke}"/><circle cx="25.4" cy="16.4" r="1.7" fill="${stroke}"/><path d="${_MOUTHS[type]}" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/></svg>`;}

let _detOverlay=null, _detEscHandler=null;
function detClose(){
  if(!_detOverlay)return;
  _detOverlay.style.display='none';
  document.body.style.overflow='';
  if(_detEscHandler){document.removeEventListener('keydown',_detEscHandler);_detEscHandler=null;}
}
async function openDetail(id){
  if(!_detOverlay){
    _detOverlay=document.createElement('div');
    _detOverlay.style.cssText='position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);overflow-y:auto;padding:40px 16px 80px';
    _detOverlay.setAttribute('tabindex','-1');
    document.body.appendChild(_detOverlay);
  }
  if(_detEscHandler)document.removeEventListener('keydown',_detEscHandler);
  _detEscHandler=e=>{if(e.key==='Escape')detClose();};
  document.addEventListener('keydown',_detEscHandler);
  _detOverlay.style.display='block';
  _detOverlay.scrollTop=0;
  document.body.style.overflow='hidden';
  _detOverlay.focus();
  const closeBtn=`<button id="detCloseBtn" style="background:none;border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--muted);font-size:.85rem;display:flex;align-items:center;justify-content:center;flex:none">✕</button>`;
  _detOverlay.innerHTML=`<div style="background:var(--surface);color:var(--text);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;width:100%;max-width:800px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)"><div style="display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border-soft)">${closeBtn}</div><div class="empty" style="padding:60px 24px">Carregando...</div></div>`;
  _detOverlay.querySelector('#detCloseBtn')?.addEventListener('click',detClose);
  try{
    const r=await fetch(`/api/resposta/${id}`);
    const data=await r.json();
    if(!data.ok)throw new Error(data.error||'Erro');
    const it=data.item;
    const dtFmt=s=>s?s.slice(0,10).split('-').reverse().join('/'):'—';
    const tipoLabel={lazer:'Lazer',negocios:'Negócios',evento:'Evento',passante:'Passante',hospede:'Hóspede'};
    const scaleBar=`<div style="background:var(--gold);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;flex-wrap:wrap;margin-bottom:0"><div style="color:#fff;font-weight:500;font-size:15px;line-height:1.3"><span>Como você classifica:</span></div><div style="display:flex;gap:14px">${_RATINGS.map(rt=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px">${_smly(rt.type,false,30,'#fff')}<span style="color:#fff;font-size:11px;font-weight:500">${rt.pt}</span></div>`).join('')}</div></div>`;
    const rRow=(qpt,val)=>`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 24px;padding:22px 0;border-bottom:1px solid var(--border-soft)"><div style="flex:1;min-width:180px;line-height:1.55;color:var(--text);font-size:15.5px">${esc(qpt)}</div><div style="display:flex;gap:6px;flex:none">${_RATINGS.map(rt=>`<div style="display:flex;align-items:center;justify-content:center;padding:6px;border:1.5px solid ${rt.key===val?'var(--gold)':'transparent'};border-radius:9999px">${_smly(rt.type,rt.key===val,36)}</div>`).join('')}</div></div>`;
    const rSec=(num,label,qs,comment)=>`<div style="margin-bottom:64px"><div style="display:flex;align-items:baseline;gap:12px;margin-bottom:18px"><span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:.1em">${num}</span><span style="font-weight:500;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--text)">${label}</span></div>${scaleBar}<div>${qs.map(q=>rRow(q.pt,it[q.key])).join('')}</div>${comment?`<div style="margin-top:16px;padding:14px 18px;background:var(--surface2);border-radius:10px;border:1px solid var(--border-soft);font-size:.92rem;color:var(--muted2);line-height:1.6;font-style:italic">"${esc(comment)}"</div>`:''}</div>`;
    const rRadio=(sel,label,sub)=>`<div style="display:flex;align-items:flex-start;gap:14px;padding:8px 0"><div style="width:18px;height:18px;border-radius:50%;border:1.5px solid ${sel?'var(--gold)':'var(--border)'};position:relative;flex:none;margin-top:3px">${sel?`<div style="position:absolute;inset:3px;border-radius:50%;background:var(--gold)"></div>`:''}</div><div><span style="font-size:1rem;color:var(--text)">${esc(label)}</span>${sub?`<span style="color:var(--muted2);font-size:.9rem"> — ${esc(sub)}</span>`:''}</div></div>`;
    const bars=[1,2,3,4].map(()=>`<div style="flex:1;height:2px;background:var(--gold);border-radius:2px"></div>`).join('');
    _detOverlay.innerHTML=`<div style="background:var(--surface);color:var(--text);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;width:100%;max-width:800px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)">
      <div style="position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border-soft);padding:12px 24px 10px;display:flex;align-items:center;justify-content:space-between">
        <div class="eyebrow">Avaliação #${id}</div>${closeBtn}
      </div>
      <div style="display:flex;gap:6px;padding:0 24px">${bars}</div>
      <div style="max-width:720px;margin:0 auto;padding:40px clamp(14px,4vw,32px) 80px">
        <div style="margin-bottom:52px">
          <div style="font-weight:500;font-size:1.3rem;color:var(--text);margin-bottom:5px">${esc(it.nome||'Sem nome')}</div>
          <div style="font-size:.82rem;color:var(--muted2)">${[esc(it.email||'—'),it.telefone?`Tel <strong style="color:var(--text)">${esc(it.telefone)}</strong>`:null,esc(tipoLabel[it.tipo_cliente]||it.tipo_cliente||'—'),it.apto?`Apto <strong style="color:var(--text)">${esc(it.apto)}</strong>`:null,esc(dtFmt(it.submitted_at))].filter(Boolean).join(' &nbsp;·&nbsp; ')}</div>
          ${(()=>{const _tp=[];if(it.tratamento_realizado)_tp.push(`Tratamento: <strong style="color:var(--text)">${esc(it.tratamento_realizado)}</strong>`);if(it.data_tratamento)_tp.push(`Data do tratamento: <strong style="color:var(--text)">${esc(dtFmt(it.data_tratamento))}</strong>`);if(it.nome_massoterapeuta)_tp.push(`Massoterapeuta: <strong style="color:var(--text)">${esc(it.nome_massoterapeuta)}</strong>`);return _tp.length?`<div style="font-size:.8rem;color:var(--muted);margin-top:10px">${_tp.join(' &nbsp;·&nbsp; ')}</div>`:'';})()}
          ${it.controle_interno?`<div style="font-size:.8rem;color:var(--muted);margin-top:8px">Controle interno: <strong style="color:var(--text)">${esc(it.controle_interno)}</strong></div>`:''}
          ${it.inserido_por?`<div style="font-size:.8rem;color:var(--muted);margin-top:8px">Inserido por: <strong style="color:var(--text)">${esc(it.inserido_por)}</strong> em ${it.submitted_at?dtFmt(it.submitted_at)+' '+it.submitted_at.slice(11,16):'—'}</div>`:''}
        </div>
        ${rSec('01','SERVIÇOS',_SEC1,it.servicos_comentario)}
        ${rSec('02','INSTALAÇÕES',_SEC2,it.instalacoes_comentario)}
        <div style="margin-bottom:60px">
          <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:18px"><span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:.1em">03</span><span style="font-weight:500;font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--text)">VOCÊ RECOMENDARIA ALGUM TRATAMENTO EM PARTICULAR?</span></div>
          ${rRadio(it.recomenda==='sim','Sim',it.recomenda_qual||null)}
          ${rRadio(it.recomenda==='nao','Não',it.recomenda_porque||null)}
        </div>
        <div style="margin-bottom:32px">
          <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:18px"><span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:.1em">04</span><span style="font-weight:500;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--text)">TIPO DE CLIENTE</span></div>
          <div style="display:flex;gap:28px;flex-wrap:wrap">${['lazer','negocios','evento'].map(t=>rRadio(it.tipo_cliente===t,tipoLabel[t]||t,null)).join('')}</div>
        </div>
      </div>
    </div>`;
    _detOverlay.querySelector('#detCloseBtn')?.addEventListener('click',detClose);
  }catch(e){
    _detOverlay.innerHTML=`<div style="background:var(--surface);border-radius:16px;width:100%;max-width:700px;margin:0 auto;padding:36px;text-align:center"><div class="empty">Erro ao carregar: ${esc(e.message)}</div><button class="btn-gold" style="margin:16px auto;display:block" id="detCloseBtn2">Fechar</button></div>`;
    _detOverlay.querySelector('#detCloseBtn2')?.addEventListener('click',detClose);
  }
}

async function openLocalDetail(id){
  if(!_detOverlay){
    _detOverlay=document.createElement('div');
    _detOverlay.style.cssText='position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);overflow-y:auto;padding:40px 16px 80px';
    _detOverlay.setAttribute('tabindex','-1');
    document.body.appendChild(_detOverlay);
  }
  if(_detEscHandler)document.removeEventListener('keydown',_detEscHandler);
  _detEscHandler=e=>{if(e.key==='Escape')detClose();};
  document.addEventListener('keydown',_detEscHandler);
  _detOverlay.style.display='block';
  _detOverlay.scrollTop=0;
  document.body.style.overflow='hidden';

function _fillUrna(sel,ids){if(!sel)return;sel.innerHTML='<option value="" disabled selected>— Urna —</option>';const _m=(_hubUrnas||[]).filter(u=>(u.pesquisas||[]).some(p=>ids.includes(p)));_m.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.nome;sel.appendChild(o);});if(_m.length===1){sel.value=_m[0].id;sel.dispatchEvent(new Event('change',{bubbles:true}));}}

async function openLocalEdit(id){
  try{
    const r=await fetch(`/api/resposta-local/${id}`);
    const data=await r.json();
    if(!data.ok)throw new Error(data.error||'Erro');
    const it=data.item, p=it.payload||{};
    const tipo=p.tipo_pesquisa||it.tipo;
    const opener=window._openers?.[tipo];

    if(opener){
      // ── Modo formulário: abre o form original e intercepta o submit ──
      let _origFetch=window.fetch;
      let _fetchPatched=true;
      let escHandler;
      const cleanup=()=>{
        if(_fetchPatched){window.fetch=_origFetch;_fetchPatched=false;}
        document.removeEventListener('keydown',escHandler);
      };
      window.fetch=async(url,opts)=>{
        if(_fetchPatched&&typeof url==='string'&&_EDIT_FORM_URLS.some(u=>url.startsWith(u))){
          cleanup();
          try{
            const resp=await _origFetch(`/api/resposta-local/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:opts?.body});
            const d=await resp.json();
            if(!d.ok)throw new Error(d.error||'Erro ao salvar');
            setTimeout(()=>render('edit'),1200);
            return new Response(JSON.stringify({ok:true,_editMode:true}),{status:200,headers:{'Content-Type':'application/json'}});
          }catch(e){
            return new Response(JSON.stringify({ok:false,error:e.message}),{status:500,headers:{'Content-Type':'application/json'}});
          }
        }
        return _origFetch(url,opts);
      };

      // Abre o formulário
      opener();

      // Fecha via Escape sem deixar window.fetch patchado
      escHandler=e=>{if(e.key==='Escape'){cleanup();document.removeEventListener('keydown',escHandler);}};
      document.addEventListener('keydown',escHandler);

      // Pré-preenche após o DOM renderizar
      requestAnimationFrame(()=>{
        const RATINGS=['otimo','bom','regular','ruim','muitobom','amelhorar'];
        const SN=['sim','nao'];
        // Ratings (smiley buttons)
        Object.entries(p).forEach(([key,val])=>{
          if(RATINGS.includes(val)){
            document.querySelector(`.smiley-btn[data-qkey="${key}"][data-val="${val}"]`)?.click();
          } else if(SN.includes(val)){
            document.querySelector(`.ev-sn-btn[data-qkey="${key}"][data-val="${val}"]`)?.click();
            document.querySelector(`.ec-sn-btn[data-qkey="${key}"][data-val="${val}"]`)?.click();
          }
        });
        // Campos de texto por ID
        const ids=_EDIT_FIELD_IDS[tipo]||{};
        const _seen=new Set();
        Object.entries(ids).forEach(([field,domId])=>{
          if(_seen.has(domId))return; // evita sobrescrever se dois campos mapeiam mesmo DOM
          const el=document.getElementById(domId);
          if(el&&p[field]!=null&&p[field]!==''){el.value=p[field];_seen.add(domId);}
        });
        // SPA: tipo de cliente e recomendação
        if(tipo==='spa'){
          if(p.tipo_cliente)document.querySelector(`[data-tipo="${p.tipo_cliente}"]`)?.click();
          if(p.recomenda==='sim'){document.getElementById('psRadioSim')?.click();const q=document.getElementById('psRecomendaQual');if(q&&p.recomenda_qual)q.value=p.recomenda_qual;}
          if(p.recomenda==='nao'){document.getElementById('psRadioNao')?.click();const q=document.getElementById('psRecomendaPorque');if(q&&p.recomenda_porque)q.value=p.recomenda_porque;}
          const sec1=document.getElementById('psComSec1');const sec2=document.getElementById('psComSec2');
          if(sec1&&(p.servicos_comentario||p.comentario_sec1))sec1.value=p.servicos_comentario||p.comentario_sec1||'';
          if(sec2&&(p.instalacoes_comentario||p.comentario_sec2))sec2.value=p.instalacoes_comentario||p.comentario_sec2||'';
        }
        // Geral: campos especiais (motivo, avaliação, identificação, expectativas)
        if(tipo==='geral'||tipo==='geral-granclass'){
          if(p.motive_visita)document.querySelector(`[data-gqtipo="${p.motive_visita}"]`)?.click();
          if(p.avaliacao_geral)document.querySelector(`[data-gqaval="${p.avaliacao_geral}"]`)?.click();
          if(p.identificacao_nome)document.querySelector(`[data-gqident="${p.identificacao_nome}"]`)?.click();
          if(p.expectativas_superadas)document.querySelector(`[data-gqexpect="${p.expectativas_superadas}"]`)?.click();
          // Comentários de seção — mapeamento explícito (gqSubmit salva como com_recepcao etc.)
          const _GQ_COM={gqComRec:'com_recepcao',gqComApt:'com_apartamento',gqComCafe:'com_cafe',gqComQto:'com_quarto'};
          Object.entries(_GQ_COM).forEach(([domId,field])=>{
            const el=document.getElementById(domId);
            if(el&&p[field])el.value=p[field];
          });
        }
        // PDVs: tipo de cliente e locais (checkboxes)
        if(tipo==='pdvs'||tipo==='pdvs-granclass'){
          if(p.tipo_cliente)document.querySelector(`[data-pdvtipo="${p.tipo_cliente}"]`)?.click();
          if(p.locais){
            const PDV_LOCAIS=['Restaurante Mangostin','Restaurante Mucuripe','Restaurante Mucuripe Jantar','Restaurante Mucuripe Chá da tarde','Rooftop','Lobby Bar'];
            const salvos=p.locais.split(',').map(s=>s.trim());
            PDV_LOCAIS.forEach((l,i)=>{if(salvos.includes(l))document.querySelector(`.pdv-loc[data-pdvloc="${i}"]`)?.click();});
          }
        }
        // Urna: pré-seleciona após _fillUrna (encadeia na mesma promise de _loadUrnas,
        // registrada DEPOIS do .then do opener — garante que as options já existem)
        if(p.urna_id){
          const _URNA_SEL={'spa':'psUrna','geral':'gqUrna','geral-granclass':'gqUrna','pdvs':'pdvUrna','pdvs-granclass':'pdvUrna','eventos-cliente':'evUrna','eventos-cerimonialista':'evUrna','eventos-corporativos':'ecUrna'};
          const _urnaId=_URNA_SEL[tipo];
          if(_urnaId){const sel=document.getElementById(_urnaId);const v=String(p.urna_id);let _tent=0;const _tryUrna=()=>{if(!sel||!sel.isConnected)return;if([...sel.options].some(o=>o.value===v)){sel.value=v;return;}if(++_tent<40)setTimeout(_tryUrna,200);};_tryUrna();}
        }

        // Observa quando o overlay fecha para restaurar fetch
        setTimeout(()=>{
          const overlays=[...document.querySelectorAll('body>div')].filter(d=>d.style.display==='block'&&parseInt(d.style.zIndex)>=999);
          overlays.forEach(ov=>{
            new MutationObserver((muts,obs)=>{
              if(ov.style.display==='none'||ov.style.display===''){cleanup();obs.disconnect();}
            }).observe(ov,{attributes:true,attributeFilter:['style']});
          });
        },100);
      });
      return;
    }

    // ── Fallback: modal genérico de edição ──
    // (mantido para tipos sem opener: legados, casos raros)
    alert('Edição genérica não disponível para este tipo. Abra o formulário pelo botão "Nova Pesquisa" para corrigir.');
  }catch(e){
    console.error('[openLocalEdit]',e);
  }
}

function buildSegs(dist){
  const {otimo=0,bom=0,muitobom=0,regular=0,amelhorar=0,ruim=0}=dist;
  const bomTot=bom+muitobom, regularTot=regular+amelhorar;
  const tot=otimo+bomTot+regularTot+ruim||1, segs=[];
  if(otimo)segs.push({w:otimo/tot*100,bg:'var(--success)',tip:`Ótimo: ${otimo}`});
  if(bomTot)segs.push({w:bomTot/tot*100,bg:'var(--gold)',tip:`Bom: ${bomTot}`});
  if(regularTot)segs.push({w:regularTot/tot*100,bg:'var(--warn-dim)',bdr:'1px solid var(--gold)',tip:`Regular: ${regularTot}`});
  if(ruim)segs.push({w:ruim/tot*100,bg:'var(--danger)',tip:`À Melhorar: ${ruim}`});
  if(!segs.length)segs.push({w:100,bg:'var(--border-soft)',tip:'Sem dados'});
  return segs;
}

  </div>`).join('');
  const totalPages=Math.ceil(total/LIMIT)||1;
  const pgHtml=totalPages>1?`<div class="pgn">
    <button class="pgn-btn" id="pgPrev" ${page<=1?'disabled':''}>← Anterior</button>
    <span class="pgn-info">Página ${page} de ${totalPages}</span>
    <button class="pgn-btn" id="pgNext" ${page>=totalPages?'disabled':''}>Próxima →</button>
  </div>`:'';
  return `<div class="tbl-hdr"><div><div class="eyebrow">Registro</div><div class="tbl-title">Avaliações</div></div><div class="tbl-count">${total} resultado${total!==1?'s':''}</div></div>

    <div class="tbl-head"><div>Data</div><div>Nome</div><div>E-mail</div><div>Tipo</div><div>Origem</div><div>Média</div><div></div></div>
    ${rHtml||'<div class="empty">Nenhuma avaliação encontrada</div>'}
  </div>${pgHtml}`;
}
